<title>領収証宛名検索</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* 構成: 上部の固定ヘッダー＋検索中心の1カラム。結果カードと詳細カードを縦に積む（スマホ優先） */
:root {

  --g0: #1d5bbf; --g1: #1b7f4a; --g2: #c26a00; --g3: #c0362c; --g4: #7a3fb8; --g5: #0f86a0; --g6: #8a5a2b; --g7: #5f6b7a;

  --radius: 12px;
}

  :root:not([data-theme="light"]) {
    --bg: #10141b; --surface: #19202a; --surface-2: #212a36; --text: #e5eaf1; --muted: #98a4b5; --border: #334051;
    --primary: #5b95f0; --primary-ink: #0b1220; --primary-soft: #1c2a43; --secondary: #253247; --secondary-ink: #cfe0fa;
    --danger: #ff7d72; --danger-soft: #3a1f1d; --warn: #f2c35a; --warn-soft: #382f16; --warn-border: #7a6220;
    --ok: #6fd391; --ok-soft: #163124; --ocr: #3b3512; --focus: #f0b04a; --toast: #2b3442; --toast-ok: #1f6b3b; --toast-err: #9c2a20; --shadow: none; --g0: #6ea2f5; --g1: #5cc98a; --g2: #f0a64a; --g3: #ff8a7f; --g4: #b98cf0; --g5: #4fc4dc; --g6: #c99a6b; --g7: #a3aebb;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10141b; --surface: #19202a; --surface-2: #212a36; --text: #e5eaf1; --muted: #98a4b5; --border: #334051;
  --primary: #5b95f0; --primary-ink: #0b1220; --primary-soft: #1c2a43; --secondary: #253247; --secondary-ink: #cfe0fa;
  --danger: #ff7d72; --danger-soft: #3a1f1d; --warn: #f2c35a; --warn-soft: #382f16; --warn-border: #7a6220;
  --ok: #6fd391; --ok-soft: #163124; --ocr: #3b3512; --focus: #f0b04a; --toast: #2b3442; --toast-ok: #1f6b3b; --toast-err: #9c2a20; --shadow: none; --g0: #6ea2f5; --g1: #5cc98a; --g2: #f0a64a; --g3: #ff8a7f; --g4: #b98cf0; --g5: #4fc4dc; --g6: #c99a6b; --g7: #a3aebb;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 16px; line-height: 1.6; }
h1 { font-size: 1.4rem; margin: 0; line-height: 1.35; word-break: break-word; text-wrap: balance; }

p { margin: .3rem 0; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

.nav button { padding: 8px 10px; border-radius: 8px; color: var(--muted); font: inherit; font-size: .92rem; font-weight: 700; background: none; border: 0; cursor: pointer; min-height: 40px; }

.linkish, .back { background: none; border: 0; padding: 0; font: inherit; color: var(--primary); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; text-align: left; }

.search-box { position: relative; }
.search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-52%); font-size: 1.5rem; color: var(--primary); pointer-events: none; }
.search-input { width: 100%; font: inherit; font-size: 1.15rem; padding: 14px 14px 14px 46px; border-radius: 14px; border: 2px solid var(--primary); background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
.search-input:focus { outline: none; box-shadow: 0 0 0 4px var(--primary-soft); }
.quick-actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
@media (max-width: 560px) { .quick-actions { grid-template-columns: 1fr 1fr; } .quick-actions .btn-primary { grid-column: 1 / -1; } }
.section-title { font-size: .95rem; color: var(--muted); margin: 8px 0; }
.result-summary { margin: 4px 0 10px; }
.result-list, .person-list, .cand-list, .history { list-style: none; padding: 0; margin: 0; }
.result-list { display: grid; gap: 10px; }
.result-card { width: 100%; display: flex; justify-content: space-between; gap: 10px; padding: 14px 16px; border-radius: var(--radius); background: var(--surface);
  border: 1px solid var(--border); color: var(--text); font: inherit; text-align: left; box-shadow: var(--shadow); }
button.result-card { cursor: pointer; }
button.result-card:hover, button.result-card:focus-visible { border-color: var(--primary); }

button.rc-link { cursor: pointer; }

.rc-kana { font-size: .82rem; color: var(--muted); font-weight: 400; }
.rc-company { font-weight: 600; }
.rc-sub { font-size: .88rem; color: var(--muted); }
.rc-receipt { font-size: .92rem; display: flex; gap: 6px; flex-wrap: wrap; }

.type-co { background: var(--primary-soft); color: var(--secondary-ink); }

.chips { display: inline-flex; flex-wrap: wrap; gap: 6px; align-items: center; }

.chip-btn, .chip-person { cursor: pointer; min-height: 32px; }
.chip-person { background: var(--primary-soft); color: var(--secondary-ink); border-color: transparent; }
.chip-btn:hover, .chip-person:hover { border-color: var(--primary); }
.empty { text-align: center; padding: 28px 12px; background: var(--surface); border-radius: var(--radius); border: 1px dashed var(--border); }
.empty-title { font-weight: 700; font-size: 1.05rem; }
.tips { text-align: left; display: inline-block; color: var(--muted); font-size: .9rem; margin: 8px 0 16px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin: 12px 0; box-shadow: var(--shadow); min-width: 0; }
.card-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }

.receipt-card { border: 2px solid var(--primary); background: var(--primary-soft); }

.receipt-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.receipt-text { font-size: 1.45rem; font-weight: 700; word-break: break-word; letter-spacing: .02em; min-width: 0; }
.receipt-alts { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 8px; }
.info { margin: 0; display: grid; }
.info-row { display: grid; grid-template-columns: 9em 1fr; gap: 8px; padding: 9px 0; border-bottom: 1px solid var(--border); }
.info-row:last-child { border-bottom: 0; }
.info dt { color: var(--muted); font-size: .9rem; }

.person-row { width: 100%; display: grid; grid-template-columns: 1.3fr 1fr 1.6fr auto; gap: 8px; padding: 10px 4px; border: 0; border-bottom: 1px solid var(--border); background: none; color: var(--text); font: inherit; text-align: left; cursor: pointer; align-items: center; }
.person-row:hover { background: var(--surface-2); }

.pr-name { font-weight: 700; }

.thumbs { display: flex; gap: 10px; flex-wrap: wrap; }

.memo-text { width: 100%; font: inherit; line-height: 1.7; padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--text); resize: vertical; min-height: 140px; }
.memo-foot { display: flex; justify-content: space-between; align-items: flex-end; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.memo-status { font-size: .86rem; font-weight: 700; padding: 2px 10px; border-radius: 999px; }

.form { display: grid; gap: 4px; }
