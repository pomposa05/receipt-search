<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#1f5fbf">
  <title>領収証宛名検索</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/css/app.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <a class="skip" href="#app">本文へ移動</a>
  <header class="topbar">
    <a class="brand" href="#/"><img src="/icon.svg" alt="" width="28" height="28"><span>領収証宛名検索</span></a>
    <nav class="nav" aria-label="メインメニュー">
      <a href="#/" data-section="">検索</a>
      <a href="#/new" data-section="new">新規登録</a>
      <a href="#/admin" data-section="admin">管理</a>
      <button type="button" id="logout" class="nav-btn" hidden>ログアウト</button>
    </nav>
  </header>
  <div id="conn-banner" class="conn-banner" role="alert" hidden>
    <span>サーバーに接続できません。通信状態とアプリの起動を確認してください。入力中の内容は画面に残っています。</span>
    <button type="button" id="conn-retry" class="btn btn-sm">再接続</button>
  </div>
  <main id="app" class="container" tabindex="-1">
    <noscript>このアプリを使うには JavaScript を有効にしてください。</noscript>
  </main>
  <div id="toasts" class="toasts" aria-live="polite"></div>

</html>
