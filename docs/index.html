<script>
// ===== GitHub Pages版（スマホ保存）用のランタイム =====
// アーティファクト版が claude.ai から受け取る機能（db / assets / downloads / user）を、
// ブラウザ内の IndexedDB で置き換える。データはこの端末のこのブラウザの中だけに保存され、外部へは送らない。
(() => {
  const DB_NAME = 'receipt-search-local';
  const DB_VERSION = 1;
  let idb = null;
  const docs = new Map(); // "coll/id" → data
  const blobs = new Map(); // assetId → { blob, url }
  const listeners = new Map(); // coll → Set(fn)
  let ready = null;

  const reqP = (req) => new Promise((res, rej) => { req.onsuccess = () => res(req.result); req.onerror = () => rej(req.error); });
  const txDone = (tx) => new Promise((res, rej) => { tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error || new Error('abort')); });
  const err = (code, message) => Object.assign(new Error(message), { code });

  function open() {
    if (ready) return ready;
    ready = (async () => {
      if (!('indexedDB' in window)) throw err('not_granted', 'IndexedDB unavailable');
      idb = await new Promise((res, rej) => {
        const r = indexedDB.open(DB_NAME, DB_VERSION);
        r.onupgradeneeded = () => {
          const d = r.result;
          if (!d.objectStoreNames.contains('docs')) d.createObjectStore('docs', { keyPath: 'path' });
          if (!d.objectStoreNames.contains('blobs')) d.createObjectStore('blobs', { keyPath: 'id' });
        };
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
        r.onblocked = () => rej(err('unavailable', 'blocked'));
      });
      const tx = idb.transaction(['docs', 'blobs'], 'readonly');
      const all = await reqP(tx.objectStore('docs').getAll());
      for (const row of all) docs.set(row.path, row.data);
      const bl = await reqP(tx.objectStore('blobs').getAll());
      for (const row of bl) blobs.set(row.id, { blob: row.blob, url: URL.createObjectURL(row.blob) });
      return true;
    })();
    return ready;
  }

  const clone = (x) => (x === undefined ? undefined : JSON.parse(JSON.stringify(x)));
  const collOf = (path) => path.split('/').slice(0, -1).join('/');
  function snapshotOf(coll) {
    const list = [];
    for (const [p, d] of docs) if (collOf(p) === coll) list.push({ id: p.split('/').pop(), exists: true, data: () => clone(d), metadata: { fromCache: false, hasPendingWrites: false } });
    list.sort((a, b) => (a.id < b.id ? -1 : a.id > b.id ? 1 : 0));
    return { docs: list, size: list.length, empty: !list.length, docChanges: () => [], metadata: { fromCache: false, hasPendingWrites: false } };
  }
  function notify(coll) {
    const set = listeners.get(coll);
    if (!set) return;
    const snap = snapshotOf(coll);
    for (const fn of set) { try { fn(snap); } catch (e) { console.error(e); } }
  }
  let persistAsked = false;
  async function askPersist() {
    // 端末の空き容量が少なくなっても、このアプリのデータを自動で消さないよう依頼する
    if (persistAsked || !navigator.storage?.persist) return;
    persistAsked = true;
    try { await navigator.storage.persist(); } catch { /* 対応していない */ }
  }
  async function write(path, data) {
    await open();
    const tx = idb.transaction('docs', 'readwrite');
    if (data === null) tx.objectStore('docs').delete(path);
    else tx.objectStore('docs').put({ path, data });
    try { await txDone(tx); } catch (e) { throw err(e?.name === 'QuotaExceededError' ? 'quota_exceeded' : 'unavailable', String(e?.message || e)); }
    if (data === null) docs.delete(path); else docs.set(path, data);
    askPersist();
    notify(collOf(path));
  }

  const db = {
    doc(path) {
      return {
        id: path.split('/').pop(),
        path,
        async get() { await open(); const d = docs.get(path); return { id: path.split('/').pop(), exists: d !== undefined, data: () => clone(d), metadata: { fromCache: false, hasPendingWrites: false } }; },
        async set(data) { await write(path, clone(data)); },
        async update(patch) {
          await open();
          const cur = docs.get(path);
          if (cur === undefined) throw err('invalid_argument', 'document does not exist');
          await write(path, { ...cur, ...clone(patch) });
        },
        async delete() { await write(path, null); },
      };
    },
    collection(coll) {
      return {
        onSnapshot(next, onError) {
          if (!listeners.has(coll)) listeners.set(coll, new Set());
          listeners.get(coll).add(next);
          open().then(() => next(snapshotOf(coll)), (e) => onError?.({ code: e.code || 'unavailable', message: String(e.message || e) }));
          return () => listeners.get(coll)?.delete(next);
        },
      };
    },
  };

  const randomId = () => [...crypto.getRandomValues(new Uint8Array(16))].map((b) => b.toString(16).padStart(2, '0')).join('');
  const assets = {
    async upload(blob, opts = {}) {
      await open();
      const id = randomId();
      const stored = opts.type && blob.type !== opts.type ? new Blob([blob], { type: opts.type }) : blob;
      const tx = idb.transaction('blobs', 'readwrite');
      tx.objectStore('blobs').put({ id, blob: stored, createdAt: new Date().toISOString() });
      try { await txDone(tx); } catch (e) { throw err(e?.name === 'QuotaExceededError' ? 'quota_or_state' : 'store_unavailable', String(e?.message || e)); }
      const url = URL.createObjectURL(stored);
      blobs.set(id, { blob: stored, url });
      askPersist();
      return { id, url, sizeBytes: stored.size, contentType: stored.type };
    },
    async delete(id) {
      await open();
      const tx = idb.transaction('blobs', 'readwrite');
      tx.objectStore('blobs').delete(id);
      await txDone(tx);
      const b = blobs.get(id);
      if (b) { URL.revokeObjectURL(b.url); blobs.delete(id); }
      return { deleted: !!b };
    },
  };

  const downloads = {
    async save({ filename, data }) {
      const blob = data instanceof Blob ? data : new Blob([data], { type: filename.endsWith('.json') ? 'application/json' : filename.endsWith('.csv') ? 'text/csv' : 'application/octet-stream' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename; a.rel = 'noopener';
      document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
      return { status: 'saved' };
    },
  };

  const user = { isOwner: async () => true, canEdit: async () => true, can: async () => true, id: async () => 'local' };

  window.LOCAL_STORE = {
    assetUrl: (id) => blobs.get(id)?.url || '',
    async info() {
      let persisted = null; let usage = null; let quota = null;
      try { persisted = navigator.storage?.persisted ? await navigator.storage.persisted() : null; } catch { /* noop */ }
      try { const e = navigator.storage?.estimate ? await navigator.storage.estimate() : null; usage = e?.usage ?? null; quota = e?.quota ?? null; } catch { /* noop */ }
      return { persisted, usage, quota, standalone: window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true };
    },
    requestPersist: async () => { try { return navigator.storage?.persist ? await navigator.storage.persist() : false; } catch { return false; } },
  };
  // アプリ本体はアーティファクト版と同じく window.claude.use(name) で機能を受け取る
  window.claude = {
    use: async (name) => {
      try { await open(); } catch { return null; }
      return { db, assets, downloads, user }[name] ?? null; // sample（Claudeによる読み取り）は使わない
    },
  };
})();

if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>

:root {

  --shadow: 0 1px 2px rgba(20, 30, 55, .06), 0 2px 8px rgba(20, 30, 55, .05);
  --g0: #1d5bbf; --g1: #1b7f4a; --g2: #c26a00; --g3: #c0362c; --g4: #7a3fb8; --g5: #0f86a0; --g6: #8a5a2b; --g7: #5f6b7a;
  --font: "Noto Sans JP", system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", Meiryo, sans-serif;
  --radius: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10141b; --surface: #19202a; --surface-2: #212a36; --text: #e5eaf1; --muted: #98a4b5; --border: #334051;
    --primary: #5b95f0; --primary-ink: #0b1220; --primary-soft: #1c2a43; --secondary: #253247; --secondary-ink: #cfe0fa;
    --danger: #ff7d72; --danger-soft: #3a1f1d; --warn: #f2c35a; --warn-soft: #382f16; --warn-border: #7a6220;
    --ok: #6fd391; --ok-soft: #163124; --ocr: #3b3512; --focus: #f0b04a; --toast: #2b3442; --toast-ok: #1f6b3b; --toast-err: #9c2a20; --shadow: none; --g0: #6ea2f5; --g1: #5cc98a; --g2: #f0a64a; --g3: #ff8a7f; --g4: #b98cf0; --g5: #4fc4dc; --g6: #c99a6b; --g7: #a3aebb;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10141b; --surface: #19202a; --surface-2: #212a36; --text: #e5eaf1; --muted: #98a4b5; --border: #334051;

  --ok: #6fd391; --ok-soft: #163124; --ocr: #3b3512; --focus: #f0b04a; --toast: #2b3442; --toast-ok: #1f6b3b; --toast-err: #9c2a20; --shadow: none; --g0: #6ea2f5; --g1: #5cc98a; --g2: #f0a64a; --g3: #ff8a7f; --g4: #b98cf0; --g5: #4fc4dc; --g6: #c99a6b; --g7: #a3aebb;
  color-scheme: dark;

  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.search-input:focus { outline: none; box-shadow: 0 0 0 4px var(--primary-soft); }

.section-title { font-size: .95rem; color: var(--muted); margin: 8px 0; }

  border: 1px solid var(--border); color: var(--text); font: inherit; text-align: left; box-shadow: var(--shadow); }

  '﨔': '欅', '舘': '館', '桒': '桑', '曽': '曾', '籠': '篭', '凜': '凛',
};

/** 法人格（正規化前のNFKC小文字文字列に対して除去する） */
const LEGAL_FORMS_JA = new RegExp(
  [
    '株式会社', '有限会社', '合同会社', '合資会社', '合名会社',
    '(?:一般|公益)(?:社団|財団)法人', '特定非営利活動法人', 'npo法人',
    '医療法人(?:社団|財団)?', '社会福祉法人', '学校法人', '宗教法人', '独立行政法人',
    '(?:弁護士|税理士|司法書士|行政書士|社会保険労務士|弁理士|監査|特許業務|土地家屋調査士)法人',
    '\\((?:株|有|合|同|資|名|社|財|医|学|福|一社|一財|公社|公財|特非|独)\\)',
  ].join('|'),
  'g',
);
const LEGAL_FORMS_EN = /\b(?:co\.?\s*,?\s*ltd\.?|company\s+limited|inc\.?|incorporated|corp\.?|corporation|limited|ltd\.?|llc|l\.l\.c\.|k\.k\.|g\.k\.|y\.k\.)(?=\s|$|[^a-z])/g;
/** 読み（ひらがな化済み）に含まれる法人格 */
const LEGAL_FORMS_KANA = /(かぶしきがいしゃ|かぶしきかいしゃ|ゆうげんがいしゃ|ゆうげんかいしゃ|ごうどうがいしゃ|ごうどうかいしゃ|ごうしがいしゃ|ごうめいがいしゃ)/g;

function nfkc(s) {
  return String(s ?? '').normalize('NFKC');
}

/** 表示用比較（完全一致判定）: NFKC + 前後空白除去 + 連続空白を1つに */
function displayKey(s) {
  return nfkc(s).trim().replace(/\s+/g, ' ').toLowerCase();
}

function toHiragana(s) {
  return String(s ?? '').replace(/[ァ-ヶ]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0x60));
}

function toKatakana(s) {
  return String(s ?? '').replace(/[ぁ-ゖ]/g, (c) => String.fromCharCode(c.charCodeAt(0) + 0x60));
}

function replaceItaiji(s) {
  let out = '';
  for (const ch of s) out += ITAIJI[ch] || ch;
  return out;
}

/** 検索用正規化 */
function normalize(s) {
  let t = nfkc(s).toLowerCase();
  // かなの直後のダッシュ類は長音とみなす（例: サンプル－ → サンプルー）
  t = t.replace(/([ぁ-ゖァ-ヺ])[‐‑‒–—―−-]/g, '$1ー');
  t = toHiragana(t);
  t = replaceItaiji(t);
  // 文字・数字・長音・繰り返し記号以外（空白・記号・括弧など）を除去
  t = t.replace(/[^\p{L}\p{N}ー々〆ゝゞ]/gu, '');
  return t;
}

/** 企業名から法人格を除いた「中核名」を正規化して返す */
function companyCore(s) {
  let t = nfkc(s).toLowerCase();
  t = t.replace(LEGAL_FORMS_JA, ' ').replace(LEGAL_FORMS_EN, ' ');
  let n = normalize(t).replace(LEGAL_FORMS_KANA, '');
  if (!n) n = normalize(s); // 法人格だけの文字列の場合は元を使う
  return n;
}

/** 法人格を含むか */
function hasLegalForm(s) {
  const t = nfkc(s).toLowerCase();
  LEGAL_FORMS_JA.lastIndex = 0;
  LEGAL_FORMS_EN.lastIndex = 0;
  const r = LEGAL_FORMS_JA.test(t) || LEGAL_FORMS_EN.test(t);
  LEGAL_FORMS_JA.lastIndex = 0;
  LEGAL_FORMS_EN.lastIndex = 0;
  return r;
}

/** キーワード文字列を個々のキーワードに分割（カンマ・読点・改行・空白区切り） */
function splitKeywords(s) {
  return nfkc(s)
    .split(/[,、，;；\n\r\t ]+/)
    .map((k) => k.trim())
    .filter(Boolean);
}

/** キーワードの表記を整える（重複除去・区切りを「, 」に統一） */
function tidyKeywords(s) {
  const seen = new Set();
  const out = [];
  for (const k of splitKeywords(s)) {
    const key = normalize(k);
    if (!key || seen.has(key)) continue;
    seen.add(key);
    out.push(k);
  }
  return out.join(', ');
}

/** 検索語を空白で分割（全角空白も対象） */
function splitTerms(q) {
  return nfkc(q).trim().split(/\s+/).filter(Boolean);
}

// --- similarity.js ---
// 類似度判定（曖昧検索用）

/**
 * 編集距離（制限付きDamerau-Levenshtein / OSA）: 置換・挿入・削除・隣接入替を1回と数える
 */
function editDistance(a, b) {
  const s = [...a];
  const t = [...b];
  const m = s.length;
  const n = t.length;
  if (!m) return n;
  if (!n) return m;
  let prev2 = null;
  let prev = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) {
    const cur = new Array(n + 1);
    cur[0] = i;
    for (let j = 1; j <= n; j++) {
      const cost = s[i - 1] === t[j - 1] ? 0 : 1;
      let v = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + cost);
      if (prev2 && i > 1 && j > 1 && s[i - 1] === t[j - 2] && s[i - 2] === t[j - 1]) {
        v = Math.min(v, prev2[j - 2] + 1);
      }
      cur[j] = v;
    }
    prev2 = prev;
    prev = cur;
  }
  return prev[n];
}

/**
 * 近似部分一致距離（Sellersのアルゴリズム、隣接入替対応）
 * query が text のどこかの部分文字列と何文字違いで一致するかを返す。
 */
function substringDistance(query, text) {
  const q = [...query];
  const t = [...text];
  const m = q.length;
  const n = t.length;
  if (!m) return 0;
  if (!n) return m;
  // D[i][j]: q[0..i) と t の j で終わる部分文字列との最小距離（開始位置は自由）
  let prev2 = null;
  let prev = new Array(n + 1).fill(0);
  for (let i = 1; i <= m; i++) {
    const cur = new Array(n + 1);
    cur[0] = i;
    for (let j = 1; j <= n; j++) {
      const cost = q[i - 1] === t[j - 1] ? 0 : 1;
      let v = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + cost);
      if (prev2 && i > 1 && j > 1 && q[i - 1] === t[j - 2] && q[i - 2] === t[j - 1]) {
        v = Math.min(v, prev2[j - 2] + 1);
      }
      cur[j] = v;
    }
    prev2 = prev;
    prev = cur;
  }
  let best = m;
  for (let j = 0; j <= n; j++) if (prev[j] < best) best = prev[j];
  return best;
}

/**
 * 文字の抜け（脱字）を許した一致: query の文字が text に順番通り現れるか。
 * 一致した場合は {span} (text上の最短区間長) を返す。
 */
function subsequenceSpan(query, text) {
  const q = [...query];
  const t = [...text];
  if (!q.length || q.length > t.length) return null;
  let best = null;
  for (let start = 0; start < t.length; start++) {
    if (t[start] !== q[0]) continue;
    let qi = 1;
    let j = start + 1;
    for (; j < t.length && qi < q.length; j++) if (t[j] === q[qi]) qi++;
    if (qi === q.length) {
      const span = j - start;
      if (best === null || span < best) best = span;
    }
  }
  return best;
}

/** 検索語の長さから許容する誤字数を決める（短い語ほど厳しく） */
function allowedErrors(len) {
  if (len >= 11) return 3;
  if (len >= 7) return 2;
  if (len >= 4) return 1;
  return 0;
}

// --- engine.js ---
// 検索エンジン（DBから独立。データを受け取り索引を作り、検索する）
//
// 検索順位（同じ入力 → 常に同じ結果）
//   1. 一致レベル（基本点）
//        完全一致 1000 / 正規化後の一致 900 / 前方一致 800 / 部分一致 700
//        類似：脱字 500〜550 / 類似：誤字 220〜400（候補扱い）
//   2. 一致した項目（加点）
//        名前 60 / 企業名 55 / 企業名+名前 50 / 読み 45 / 領収証宛名 40 / キーワード 35
//        部署・役職 20 / 旧企業名 15 / メモ 10
//   3. 同点時: 一致レベルの高い順 → 読み（なければ名前）の五十音順 → 種別（企業→人物）→ ID昇順

const LEVELS = {
  EXACT: { rank: 1, base: 1000, label: '完全一致' },
  NORMALIZED: { rank: 2, base: 900, label: '一致（表記揺れ吸収）' },
  PREFIX: { rank: 3, base: 800, label: '前方一致' },
  CONTAINS: { rank: 4, base: 700, label: '部分一致' },
  SUBSEQ: { rank: 5, base: 500, label: '類似（文字の抜け）', candidate: true },
  FUZZY: { rank: 6, base: 400, label: '類似（誤字の可能性）', candidate: true },
};

const FIELD = {
  name: { label: '名前', bonus: 60, fuzzy: true },
  company: { label: '企業名', bonus: 55, fuzzy: true, company: true },
  combined: { label: '企業名+名前', bonus: 50, fuzzy: true },
  kana: { label: '読み', bonus: 45, fuzzy: true },
  companyKana: { label: '企業名の読み', bonus: 44, fuzzy: true, company: true },
  receipt: { label: '領収証宛名', bonus: 40, fuzzy: false },
  keyword: { label: 'キーワード', bonus: 35, fuzzy: true },
  companyKeyword: { label: '企業キーワード', bonus: 30, fuzzy: false, company: true },
  dept: { label: '部署・役職', bonus: 20, fuzzy: false },
  oldCompany: { label: '旧企業名', bonus: 15, fuzzy: false, company: true },
  memo: { label: 'メモ', bonus: 10, fuzzy: false },
};

const FUZZY_MAX_FIELD_LEN = 80;
/** ID比較（数値IDでも文字列IDでも同じ規則で並べる） */
const cmpId = (x, y) => (x < y ? -1 : x > y ? 1 : 0);

function makeField(key, raw, { isCompany = false, kana = false } = {}) {
  const value = String(raw ?? '');
  if (!value.trim()) return null;
  const norm = kana ? normalize(toHiragana(value)) : normalize(value);
  if (!norm) return null;
  const forms = [norm];
  if (isCompany) {
    const core = companyCore(value);
    if (core && core !== norm) forms.push(core);
  }
  return { key, def: FIELD[key], raw: value, display: displayKey(value), forms };
}

function pushField(list, f) {
  if (f) list.push(f);
}

/**
 * 索引の作成
 * @param {object} data {companies, persons, companyNameHistory}
 * @param {(text:string)=>string} reading 自動読み（ひらがな/カタカナ）を返す関数。不明なら ''
 */
function buildIndex(data, reading = () => '') {
  const companiesById = new Map(data.companies.map((c) => [c.id, c]));
  const oldNames = new Map();
  for (const h of data.companyNameHistory || []) {
    if (!oldNames.has(h.company_id)) oldNames.set(h.company_id, []);
    oldNames.get(h.company_id).push(h.old_name);
  }
  const personsByCompany = new Map();
  for (const p of data.persons) {
    if (p.company_id == null) continue;
    if (!personsByCompany.has(p.company_id)) personsByCompany.set(p.company_id, []);
    personsByCompany.get(p.company_id).push(p);
  }

  const companyFields = (c, prefix = true) => {
    const fs = [];
    pushField(fs, makeField('company', c.name, { isCompany: true }));
    const ck = c.name_kana || reading(c.name);
    pushField(fs, makeField('companyKana', ck, { isCompany: true, kana: true }));
    for (const k of splitKeywords(c.keywords)) pushField(fs, makeField(prefix ? 'companyKeyword' : 'keyword', k));
    for (const o of oldNames.get(c.id) || []) pushField(fs, makeField('oldCompany', o, { isCompany: true }));
    return fs;
  };

  const docs = [];
  for (const c of data.companies) {
    const fields = companyFields(c, false);
    pushField(fields, makeField('receipt', c.receipt_name));
    pushField(fields, makeField('memo', c.memo));
    const members = (personsByCompany.get(c.id) || []).slice().sort((a, b) => cmpId(a.id, b.id));
    docs.push({
      type: 'company',
      id: c.id,
      fields,
      sortKey: normalize(c.name_kana || reading(c.name) || c.name),
      summary: {
        type: 'company',
        id: c.id,
        name: c.name,
        nameKana: c.name_kana,
        receiptName: c.receipt_name,
        keywords: c.keywords,
        personCount: members.length,
        persons: members.slice(0, 8).map((p) => ({ id: p.id, name: p.name, nameKana: p.name_kana })),
        updatedAt: c.updated_at,
      },
    });
  }

  for (const p of data.persons) {
    const c = p.company_id != null ? companiesById.get(p.company_id) : null;
    const fields = [];
    pushField(fields, makeField('name', p.name));
    const kana = p.name_kana || reading(p.name);
    pushField(fields, makeField('kana', kana, { kana: true }));
    if (c) {
      for (const f of companyFields(c, true)) fields.push(f);
      pushField(fields, makeField('combined', `${c.name}${p.name}`, { isCompany: true }));
      pushField(fields, makeField('combined', `${p.name}${c.name}`, { isCompany: true }));
    }
    for (const k of splitKeywords(p.keywords)) pushField(fields, makeField('keyword', k));
    pushField(fields, makeField('receipt', p.receipt_name));
    pushField(fields, makeField('dept', p.department));
    pushField(fields, makeField('dept', p.title));
    pushField(fields, makeField('memo', p.memo));
    docs.push({
      type: 'person',
      id: p.id,
      companyId: c ? c.id : null,
      fields,
      sortKey: normalize(kana || p.name),
      summary: {
        type: 'person',
        id: p.id,
        name: p.name,
        nameKana: p.name_kana,
        nameKanaAuto: p.name_kana ? '' : toHiragana(reading(p.name) || ''),
        companyId: c ? c.id : null,
        companyName: c ? c.name : '',
        department: p.department,
        title: p.title,
        receiptName: p.receipt_name,
        keywords: p.keywords,
        updatedAt: p.updated_at,
      },
    });
  }
  return { docs, builtAt: Date.now() };
}

/** 検索語の準備（正規化形と、法人格略記を外した派生形） */
function prepareTerm(raw) {
  const norm = normalize(raw);
  const variants = [{ norm, penalty: 0 }];
  const core = companyCore(raw);
  if (core && core !== norm) variants.push({ norm: core, penalty: 5 });
  // 「株サンプル」「サンプル株」のような略記
  const m = norm.match(/^(株|有|合)(.{2,})$/) || norm.match(/^(.{2,})(株|有)$/);
  if (m) {
    const stripped = norm.startsWith(m[1]) && m[1].length === 1 ? m[2] : m[1];
    if (stripped && !variants.some((v) => v.norm === stripped)) variants.push({ norm: stripped, penalty: 10 });
  }
  return { raw, display: displayKey(raw), norm, variants };
}

/** 1つの検索語 × 1つの項目の一致判定 */
function matchField(term, field) {
  if (!term.norm) return null;
  if (term.display && term.display === field.display) {
    return { level: LEVELS.EXACT, score: LEVELS.EXACT.base + field.def.bonus };
  }
  let best = null;
  const consider = (level, extra = 0) => {
    const score = level.base + field.def.bonus + extra;
    if (!best || score > best.score) best = { level, score };
  };
  for (const v of term.variants) {
    if (!v.norm) continue;
    for (const form of field.forms) {
      if (form === v.norm) consider(LEVELS.NORMALIZED, -v.penalty);
      else if (form.startsWith(v.norm)) consider(LEVELS.PREFIX, -v.penalty + coverageBonus(v.norm, form));
      else if (form.includes(v.norm)) consider(LEVELS.CONTAINS, -v.penalty + coverageBonus(v.norm, form));
    }
  }
  if (best || !field.def.fuzzy) return best;

  // 類似一致（候補扱い）
  for (const v of term.variants) {
    const q = v.norm;
    const qLen = [...q].length;
    for (const form of field.forms) {
      const fLen = [...form].length;
      if (fLen > FUZZY_MAX_FIELD_LEN) continue;
      // 脱字: 検索語の文字が順番通りに含まれる（例: 株サンプル → 株式会社サンプル）
      if (qLen >= 3) {
        const span = subsequenceSpan(q, form);
        if (span !== null && span <= qLen * 2 + 2) {
          consider(LEVELS.SUBSEQ, Math.round(50 * (qLen / span)) - v.penalty);
        }
      }
      // 誤字: 編集距離
      const maxErr = allowedErrors(qLen);
      if (maxErr > 0) {
        const d = substringDistance(q, form);
        if (d > 0 && d <= maxErr) consider(LEVELS.FUZZY, -60 * d - v.penalty);
      }
      // 短い語（3文字）は項目全体と1文字違いのときのみ
      if (qLen === 3 && fLen <= 4) {
        const d = editDistance(q, form);
        if (d === 1) consider(LEVELS.FUZZY, -90 - v.penalty);
      }
    }
  }
  return best;
}

/** 部分一致の際、項目に占める割合が大きいほど少し加点（0〜9） */
function coverageBonus(q, form) {
  return Math.min(9, Math.floor((9 * [...q].length) / Math.max(1, [...form].length)));
}

function matchDoc(term, doc) {
  let best = null;
  for (const field of doc.fields) {
    const m = matchField(term, field);
    if (m && (!best || m.score > best.score)) best = { ...m, field };
  }
  return best;
}

/**
 * 検索
 * @returns {{results: object[], total: number, query: string}}
 */
function search(index, query, { limit = 50 } = {}) {
  const q = String(query ?? '').trim();
  if (!q) return { query: q, results: [], total: 0 };
  const terms = splitTerms(q).map(prepareTerm).filter((t) => t.norm);
  const whole = prepareTerm(q);
  if (!whole.norm) return { query: q, results: [], total: 0 };

  const hits = [];
  for (const doc of index.docs) {
    const candidates = [];
    // A) 入力全体を1語として照合
    const w = matchDoc(whole, doc);
    if (w) candidates.push({ score: w.score, level: w.level, matches: [w] });
    // B) 複数語（空白区切り）は全語一致（AND）
    if (terms.length > 1) {
      const ms = terms.map((t) => matchDoc(t, doc));
      if (ms.every(Boolean)) {
        const avg = Math.round(ms.reduce((s, m) => s + m.score, 0) / ms.length);
        const worst = ms.reduce((a, m) => (m.level.rank > a.rank ? m.level : a), LEVELS.EXACT);
        candidates.push({ score: avg, level: worst, matches: ms });
      }
    }
    if (!candidates.length) continue;
    candidates.sort((a, b) => b.score - a.score || a.level.rank - b.level.rank);
    const c = candidates[0];
    hits.push({
      doc,
      score: c.score,
      level: c.level,
      viaCompanyOnly: c.matches.every((m) => m.field.def.company),
      matches: c.matches.map((m) => ({
        field: m.field.def.label,
        level: m.level.label,
        candidate: !!m.level.candidate,
      })),
    });
  }

  // 企業そのものが結果に含まれる場合、「企業名でのみ一致した人物」は企業カードの中にまとめる
  const companyHitIds = new Set(hits.filter((h) => h.doc.type === 'company').map((h) => h.doc.id));
  const filtered = hits.filter(
    (h) => !(h.doc.type === 'person' && h.viaCompanyOnly && h.doc.companyId != null && companyHitIds.has(h.doc.companyId)),
  );

  filtered.sort((a, b) =>
    b.score - a.score
    || a.level.rank - b.level.rank
    || (a.doc.sortKey < b.doc.sortKey ? -1 : a.doc.sortKey > b.doc.sortKey ? 1 : 0)
    || (a.doc.type === b.doc.type ? 0 : a.doc.type === 'company' ? -1 : 1)
    || cmpId(a.doc.id, b.doc.id));

  const results = filtered.slice(0, limit).map((h) => ({
    ...h.doc.summary,
    score: h.score,
    matchLevel: h.level.label,
    isCandidate: !!h.level.candidate,
    matches: h.matches,
  }));
  return { query: q, results, total: filtered.length };
}

// --- ocr/extract.js（PC版と同一の抽出規則）---
// OCRで得た行テキストから、名刺・書類の項目（名前・企業名など）を抽出する
// 方針: 判別できない項目は推測で埋めない。
//   confidence: 'high'   … 規則に明確に合致（入力欄に反映）
//               'medium' … 候補が1つに絞れた（入力欄に反映、要確認表示）
//               'low'    … 複数候補・不確実（入力欄には反映せず、候補として提示のみ）
//               'none'   … 見つからない

const CJK = '\\p{Script=Han}\\p{Script=Hiragana}\\p{Script=Katakana}ー々〆';
const RE_SINGLE_CJK = new RegExp(`^[${CJK}]$`, 'u');

const COMPANY_WORDS = /(株式会社|有限会社|合同会社|合資会社|合名会社|社団法人|財団法人|法人|\((株|有|合|同)\)|co\.?,?\s*ltd|inc\.?\b|corp\.?\b|corporation|company|k\.k\.|事務所|研究所|協会|組合|商店|商会|工業|製作所|銀行|病院|クリニック|医院|大学|学校|ホールディングス|グループ本社)/i;
const DEPT_WORDS = /(本部|事業部|営業部|[^\s]{1,10}部$|[^\s]{1,10}部\s|[^\s]{1,10}課|[^\s]{1,10}室|センター|グループ|チーム|支店|支社|営業所|工場|事業所|部門|局)/;
const TITLE_WORDS = /(代表取締役社長|代表取締役|取締役社長|取締役|代表社員|代表理事|代表|社長|副社長|会長|専務|常務|執行役員|監査役|理事長|理事|部長|次長|課長|係長|主任|主査|主事|室長|所長|店長|支店長|工場長|センター長|マネージャー|マネジャー|ディレクター|リーダー|チーフ|スタッフ|担当|顧問|参与|院長|教授|准教授|講師|税理士|弁護士|公認会計士|司法書士|行政書士|社会保険労務士|一級建築士|CEO|COO|CFO|CTO)/i;
const ADDRESS_WORDS = /(〒|\d{3}-\d{4}|北海道|東京都|京都府|大阪府|.{2,3}県|市|区|町|村|丁目|番地|ビル|階|号)/;
const CONTACT = /(tel|fax|phone|mobile|携帯|電話|e-?mail|mail|url|http|www\.|@|〒|℡)/i;
const LABEL_ONLY = /^(名刺|住所|所在地|電話|携帯|メール|ホームページ|領収書|領収証|御中|様|殿|但し|但|上記正に領収いたしました)$/;

function cleanText(s) {
  const t = nfkc(s).replace(/[|｜]/g, ' ').replace(/\s+/g, ' ').trim();
  // OCRは日本語1文字ごとに空白を入れることがあるため、1文字ずつ並んだ部分だけ詰める
  // （例: 山 田 太 郎 → 山田太郎。「営業部 部長」「山田 太郎」の区切りは残す）
  const out = [];
  for (const tok of t.split(' ')) {
    const prev = out[out.length - 1];
    if (prev !== undefined && RE_SINGLE_CJK.test(tok) && prev.single) {
      prev.text += tok;
    } else {
      out.push({ text: tok, single: RE_SINGLE_CJK.test(tok) });
    }
    if (out.length && !RE_SINGLE_CJK.test(tok)) out[out.length - 1].single = false;
  }
  return out.map((o) => o.text).join(' ');
}

function splitNameTitle(text) {
  // 「営業部 部長 山田 太郎」→ 役職・部署を除いた残りを名前候補にする
  let rest = text;
  const titles = [];
  const depts = [];
  const parts = text.split(/\s+/);
  const keep = [];
  for (const part of parts) {
    if (TITLE_WORDS.test(part) && part.replace(TITLE_WORDS, '').length <= 1) titles.push(part);
    else if (DEPT_WORDS.test(`${part} `) && /(部|課|室|センター|グループ|チーム|支店|支社|営業所|本部)$/.test(part)) depts.push(part);
    else keep.push(part);
  }
  rest = keep.join(' ');
  return { rest, titles, depts };
}

function isNameLike(s) {
  const t = s.replace(/\s+/g, ' ').trim();
  if (!t) return false;
  const compact = t.replace(/\s/g, '');
  const len = [...compact].length;
  if (len < 2 || len > 8) return false;
  if (!new RegExp(`^[${CJK}]+( [${CJK}]+)?$`, 'u').test(t)) return false;
  if (/^[\p{Script=Katakana}ー]+$/u.test(compact)) return false; // カタカナのみは読みの可能性が高い
  if (/^[\p{Script=Hiragana}]+$/u.test(compact)) return false;
  if (COMPANY_WORDS.test(t) || TITLE_WORDS.test(t) || ADDRESS_WORDS.test(t) || LABEL_ONLY.test(compact)) return false;
  if (/(部|課|室|株|社)$/.test(compact)) return false;
  return true;
}

function isKanaReading(s) {
  const compact = s.replace(/\s/g, '');
  const len = [...compact].length;
  return len >= 3 && len <= 16 && /^[\p{Script=Katakana}\p{Script=Hiragana}ー・]+$/u.test(compact);
}

/**
 * @param {{text:string, confidence?:number, height?:number}[]} rawLines
 */
function extractFields(rawLines) {
  const lines = rawLines
    .map((l, i) => ({ index: i, text: cleanText(l.text), confidence: l.confidence ?? 100, height: l.height ?? 0 }))
    .filter((l) => l.text && l.text.replace(/[\s\p{P}\p{S}]/gu, '').length > 0);

  const fields = {
    name: none('名前を判別できませんでした。画像を見て入力してください。'),
    nameKana: none(''),
    companyName: none('企業名を判別できませんでした。画像を見て入力してください。'),
    department: none(''),
    title: none(''),
    email: none(''),
    phone: none(''),
    address: none(''),
    url: none(''),
  };

  // --- 連絡先系（規則が明確なもの） ---
  const emails = [];
  const phones = [];
  const urls = [];
  const addresses = [];
  for (const l of lines) {
    for (const m of l.text.matchAll(/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/g)) emails.push(m[0]);
    for (const m of l.text.matchAll(/(?:https?:\/\/|www\.)[^\s]+/gi)) urls.push(m[0]);
    // 郵便番号（〒123-4567）を電話番号と誤認しないよう除外してから探す
    const noPostal = l.text.replace(/〒\s?\d{3}-?\d{4}/g, ' ');
    for (const m of noPostal.matchAll(/(?:\+81[\s-]?|(?<!\d))0\d{1,4}[\s-]?\(?\d{1,4}\)?[\s-]?\d{3,4}(?!\d)/g)) {
      const digits = m[0].replace(/\D/g, '');
      const before = noPostal.slice(Math.max(0, m.index - 6), m.index);
      if (digits.length >= 10 && digits.length <= 12 && !/fax/i.test(before)) phones.push(m[0].trim());
    }
    if (/〒\s?\d{3}-?\d{4}/.test(l.text) || /(都|道|府|県).{1,6}(市|区|郡|町|村)/.test(l.text)) addresses.push(l.text);
  }
  if (emails.length) fields.email = found(emails[0], 'high', 'メールアドレスの形式に一致', emails);
  if (phones.length) fields.phone = found(phones[0], 'medium', '電話番号の形式に一致', phones);
  if (urls.length) fields.url = found(urls[0], 'high', 'URLの形式に一致', urls);
  if (addresses.length) fields.address = found(addresses.join(' '), 'medium', '住所の形式に一致', addresses);

  // --- 企業名 ---
  const companyCands = lines
    .filter((l) => COMPANY_WORDS.test(l.text) && !CONTACT.test(l.text) && !/(〒|丁目|番地)/.test(l.text))
    .map((l) => ({ ...l, legal: hasLegalForm(l.text) }));
  // 法人格を含む行を優先。日本語を含む行を英語表記より優先。
  companyCands.sort((a, b) => Number(b.legal) - Number(a.legal)
    || Number(/\p{Script=Han}|\p{Script=Katakana}/u.test(b.text)) - Number(/\p{Script=Han}|\p{Script=Katakana}/u.test(a.text))
    || b.height - a.height || a.index - b.index);
  const legalJa = companyCands.filter((c) => c.legal && /\p{Script=Han}|\p{Script=Katakana}/u.test(c.text));
  if (legalJa.length === 1) {
    fields.companyName = found(trimCompany(legalJa[0].text), lowConf(legalJa[0]) ? 'medium' : 'high', '法人格（株式会社など）を含む行', companyCands.map((c) => trimCompany(c.text)));
  } else if (legalJa.length > 1) {
    fields.companyName = found('', 'low', '企業名らしい行が複数あります。候補から選ぶか入力してください。', uniq(legalJa.map((c) => trimCompany(c.text))));
  } else if (companyCands.length) {
    fields.companyName = found('', 'low', '企業名の可能性がある行があります。候補から選ぶか入力してください。', uniq(companyCands.map((c) => trimCompany(c.text))));
  }

  // --- 部署・役職・名前 ---
  const usedIdx = new Set(companyCands.map((c) => c.index));
  const nameCands = [];
  const titles = [];
  const depts = [];
  for (const l of lines) {
    if (usedIdx.has(l.index) || CONTACT.test(l.text) || /\d{2,}/.test(l.text)) continue;
    const { rest, titles: ts, depts: ds } = splitNameTitle(l.text);
    titles.push(...ts);
    depts.push(...ds);
    if (!ts.length && !ds.length && DEPT_WORDS.test(`${l.text} `) && !isNameLike(l.text)) depts.push(l.text);
    if (isNameLike(rest)) nameCands.push({ ...l, text: rest.replace(/\s+/g, ' ').trim() });
  }
  if (titles.length) fields.title = found(uniq(titles).join(' '), 'medium', '役職名に一致', uniq(titles));
  if (depts.length) fields.department = found(uniq(depts).join(' '), 'medium', '部署名に一致', uniq(depts));

  if (nameCands.length) {
    const sorted = nameCands.slice().sort((a, b) => b.height - a.height || a.index - b.index);
    const top = sorted[0];
    const second = sorted[1];
    const options = uniq(sorted.map((c) => c.text));
    if (sorted.length === 1) {
      fields.name = found(top.text, lowConf(top) ? 'low' : 'medium', lowConf(top) ? '文字の認識精度が低いため確認が必要です。' : '名前らしい行が1つ見つかりました。', options);
    } else if (top.height > 0 && second.height > 0 && top.height >= second.height * 1.3 && !lowConf(top)) {
      fields.name = found(top.text, 'medium', '最も大きな文字で書かれた名前らしい行です。', options);
    } else {
      fields.name = found('', 'low', '名前らしい行が複数あります。候補から選ぶか入力してください。', options);
    }
    if (fields.name.confidence === 'low') fields.name.value = '';
  }

  // --- 読み（カタカナ・ひらがなのみの行） ---
  const kanaCands = lines.filter((l) => isKanaReading(l.text) && !COMPANY_WORDS.test(l.text));
  if (kanaCands.length === 1 && fields.name.value) {
    fields.nameKana = found(kanaCands[0].text, 'low', '名前の読みの可能性があります。', [kanaCands[0].text]);
    fields.nameKana.value = ''; // 読みは候補提示のみ
  } else if (kanaCands.length) {
    fields.nameKana = found('', 'low', '読みの可能性がある行です。', uniq(kanaCands.map((l) => l.text)));
  }

  return { lines: lines.map(({ index, text, confidence }) => ({ index, text, confidence: Math.round(confidence) })), fields };
}

function lowConf(l) {
  return (l.confidence ?? 100) < 60;
}
function trimCompany(t) {
  // 「株式会社サンプル 営業部」のように同じ行に部署がある場合は企業名部分だけにする
  const m = t.match(/^(.*?(?:株式会社|有限会社|合同会社|合資会社|合名会社|法人|\((?:株|有|合|同)\))\s?[^\s]*)(?:\s+.+(?:部|課|室|センター|支店|営業所))?$/);
  return (m ? m[1] : t).trim();
}
function uniq(a) {
  return [...new Set(a.filter(Boolean))];
}
function none(reason) {
  return { value: '', confidence: 'none', reason, options: [] };
}
function found(value, confidence, reason, options = []) {
  return { value, confidence, reason, options: uniq(options) };
}

// ===== アーティファクト版: 共通部品・データ保存・登録ルール =====
// データは claude.ai のデータベース（db 機能）に保存。読み書きは「投稿者（Contributor）」以上の権限を持つ人（所有者・編集者を含む）。閲覧者（Viewer）・組織外の閲覧者は読めない。
// collections: companies / persons / images

// 動作モード: 'artifact'（claude.ai）/ 'local'（GitHub Pages版・スマホ保存）。ビルド時に決まる
const IS_LOCAL = typeof APP_MODE !== 'undefined' && APP_MODE === 'local';
/** 保存した画像の表示用URL（アーティファクトは /_blob/、スマホ保存版は端末内の画像） */
const assetUrl = (id) => (IS_LOCAL ? (window.LOCAL_STORE?.assetUrl(id) || null) : `/_blob/${id}`);

// ---------- 画面部品 ----------
function h(tag, attrs = {}, children = []) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === undefined || v === null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else if (k === 'value') el.value = v;
    else if (k === 'checked') el.checked = !!v;
    else if (v === true) el.setAttribute(k, '');
    else el.setAttribute(k, String(v));
  }
  const add = (c) => {
    if (c === null || c === undefined || c === false || c === '') return;
    if (Array.isArray(c)) c.forEach(add);
    else el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  };
  add(children);
  return el;
}
const fill = (el, ...kids) => { el.replaceChildren(); kids.flat().forEach((k) => { if (k !== null && k !== undefined && k !== false && k !== '') el.append(k); }); return el; };

function toast(message, type = 'info', ms = 3500) {
  const t = h('div', { class: `toast toast-${type}`, role: type === 'error' ? 'alert' : 'status' }, message);
  document.getElementById('toasts').append(t);
  setTimeout(() => t.classList.add('hide'), ms);
  setTimeout(() => t.remove(), ms + 400);
}

let openDialogs = 0;
function dialog({ title, body, buttons = [{ label: 'OK', value: true, kind: 'primary' }], dismissible = true }) {
  return new Promise((resolve) => {
    const d = h('dialog', { class: 'dlg', 'aria-label': title });
    openDialogs++;
    const done = (v) => { d.close(); d.remove(); openDialogs--; resolve(v); };
    d.append(
      h('h2', { class: 'dlg-title' }, title),
      h('div', { class: 'dlg-body' }, typeof body === 'function' ? body(done) : body),
      h('div', { class: 'dlg-actions' }, buttons.map((b) => h('button', {
        type: 'button', class: `btn btn-${b.kind || 'ghost'}`, onclick: () => done(typeof b.value === 'function' ? b.value() : b.value),
      }, b.label))),
    );
    d.addEventListener('cancel', (e) => { e.preventDefault(); if (dismissible) done(null); });
    document.body.append(d);
    d.showModal();
    (d.querySelector('.btn-primary') || d.querySelector('.dlg-actions .btn'))?.focus();
  });
}
async function confirmDialog(title, message, { okLabel = 'OK', cancelLabel = 'キャンセル', danger = false } = {}) {
  const v = await dialog({
    title,
    body: [].concat(message).map((m) => (m instanceof Node ? m : h('p', {}, m))),
    buttons: [{ label: cancelLabel, value: false }, { label: okLabel, value: true, kind: danger ? 'danger' : 'primary' }],
  });
  return v === true;
}

function formatDateTime(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return '—';
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}/${p(d.getMonth() + 1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
const formatTime = (iso) => { const d = iso ? new Date(iso) : new Date(); return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };

function copyText(text, anchorEl) {
  // クリック処理の中で同期的に呼ぶ（クリップボードはユーザー操作の直後のみ許可される）
  const fallback = () => {
    if (anchorEl) {
      const r = document.createRange(); r.selectNodeContents(anchorEl);
      const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
    }
    toast('自動でコピーできませんでした。選択された文字を長押し（Ctrl+C）でコピーしてください。', 'error', 5000);
  };
  try {
    const p = navigator.clipboard?.writeText(text);
    if (!p) { fallback(); return; }
    p.then(() => toast('コピーしました', 'success', 1800), fallback);
  } catch { fallback(); }
}

function debounce(fn, ms) {
  let t;
  const d = (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
  d.cancel = () => clearTimeout(t);
  return d;
}
const loading = (text = '読み込み中…') => h('div', { class: 'loading', role: 'status' }, [h('span', { class: 'spinner', 'aria-hidden': 'true' }), text]);
const errorBox = (message, retry) => h('div', { class: 'notice notice-error', role: 'alert' }, [
  h('p', {}, message), retry ? h('button', { class: 'btn btn-ghost btn-sm', type: 'button', onclick: retry }, '再試行') : null,
]);
function keywordChips(keywords, onPick) {
  const list = String(keywords || '').split(/[,、，]\s*/).map((s) => s.trim()).filter(Boolean);
  if (!list.length) return h('span', { class: 'muted' }, '（なし）');
  return h('span', { class: 'chips' }, list.map((k) => h('button', { type: 'button', class: 'chip chip-btn', onclick: () => onPick?.(k) }, k)));
}
function defaultReceiptName(personName, companyName) {
  const p = String(personName || '').trim().replace(/\s+/g, ' ');
  const c = String(companyName || '').trim().replace(/\s+/g, ' ');
  if (c && p) return `${c} ${p} 様`;
  if (c) return `${c} 御中`;
  if (p) return `${p} 様`;
  return '';
}
const shortId = (id) => String(id || '');
// 画像読み取りで読めなかった文字は「?」（全角「？」）で表される
const UNKNOWN_RE = /[?？]/;
const hasUnknown = (s) => UNKNOWN_RE.test(String(s || ''));
const UNKNOWN_MSG = '「?」は画像から読めなかった文字です。画像と見比べて正しい文字に直してください。';
/** 「?」を強調表示した要素にする */
function markUnknown(text) {
  const parts = String(text || '').split(/([?？])/);
  return h('span', {}, parts.filter((x) => x !== '').map((x) => (UNKNOWN_RE.test(x) ? h('mark', { class: 'unknown-char', title: '読めなかった文字' }, x) : x)));
}

// ---------- ランタイム機能 ----------
const RT = { db: null, assets: null, sample: null, downloads: null, user: null, canImages: false, canWrite: null };

// ---------- データ（db を購読してメモリに保持） ----------
const S = {
  companies: new Map(), persons: new Map(), images: new Map(), groups: new Map(),
  confirmed: { companies: false, persons: false, images: false, groups: false },
  index: null, listeners: new Set(), error: null,
};
const onData = (fn) => { S.listeners.add(fn); return () => S.listeners.delete(fn); };
const notify = debounce(() => { for (const fn of [...S.listeners]) { try { fn(); } catch (e) { console.error(e); } } }, 60);

function subscribeAll() {
  for (const coll of ['companies', 'persons', 'images', 'groups']) {
    RT.db.collection(coll).onSnapshot((snap) => {
      const m = S[coll];
      m.clear();
      for (const d of snap.docs) m.set(d.id, { id: d.id, ...d.data() });
      if (!snap.metadata.fromCache) S.confirmed[coll] = true;
      S.index = null;
      notify();
    }, (e) => {
      S.error = e;
      notify();
    });
  }
}
const allConfirmed = () => S.confirmed.companies && S.confirmed.persons && S.confirmed.images && S.confirmed.groups;

class AppError extends Error {
  constructor(code, message, details) { super(message); this.code = code; this.details = details; }
}
function dbErrorMessage(e) {
  if (e instanceof AppError) return e.message;
  if (e?.code === 'invalid_argument') { const b = document.getElementById('perm-banner'); if (b) b.hidden = false; }
  switch (e?.code) {
    case 'quota_exceeded': return IS_LOCAL ? '端末の保存容量が足りません。不要な画像や登録情報を削除するか、端末の空き容量を増やしてください。' : 'データベースの保存上限に達しました。不要な登録情報を削除してください。';
    case 'resource_exhausted': return '短時間に操作が集中しました。少し待ってからもう一度お試しください。';
    case 'invalid_argument': return 'このアカウントは「閲覧のみ」のため保存できません。所有者と同じアカウントでログインするか、所有者にこのアカウントを「編集者」として招待してもらってください。ページの所有者に、共有メニューで「投稿者」以上の権限を付けてもらってください（同じアカウントでログインしている端末なら保存できます）。';
    case 'revoked': case 'not_granted': return 'このページのデータを使う権限がありません。';
    default: return IS_LOCAL ? '保存できませんでした。端末の空き容量を確認して、もう一度お試しください。' : '保存できませんでした。通信状態を確認して、もう一度お試しください。';
  }
}

// ID: 先頭に種別（P=人物 C=企業 I=画像）。時刻順に並ぶ
function newId(prefix, map) {
  for (;;) {
    const id = `${prefix}${Date.now().toString(36).toUpperCase()}${Math.random().toString(36).slice(2, 5).toUpperCase()}`;
    if (!map.has(id)) return id;
  }
}

function engineIndex() {
  if (S.index) return S.index;
  const auto = new Map();
  const companies = [...S.companies.values()].map((c) => {
    if (c.nameKanaAuto) auto.set(c.name, c.nameKanaAuto);
    return { id: c.id, name: c.name, name_kana: c.nameKana || '', keywords: withGroupNames(c), receipt_name: c.receiptName || '', memo: c.memo || '', updated_at: c.updatedAt };
  });
  const persons = [...S.persons.values()].map((p) => {
    if (p.nameKanaAuto) auto.set(p.name, p.nameKanaAuto);
    return {
      id: p.id, company_id: p.companyId || null, name: p.name, name_kana: p.nameKana || '', keywords: withGroupNames(p),
      receipt_name: p.receiptName || '', department: p.department || '', title: p.title || '', memo: p.memo || '', updated_at: p.updatedAt,
    };
  });
  const history = [...S.companies.values()].flatMap((c) => (c.nameHistory || []).map((x) => ({ company_id: c.id, old_name: x.oldName })));
  S.index = buildIndex({ companies, persons, companyNameHistory: history }, (s) => auto.get(s) || '');
  return S.index;
}

// ---------- 登録ルール ----------
const LIMITS = { name: 100, nameKana: 200, department: 100, title: 100, keywords: 1000, receiptName: 200, memo: 100000 };
const LABELS = { name: '名前', nameKana: '読み', department: '部署', title: '役職', keywords: 'キーワード', receiptName: '領収証宛名', memo: 'メモ' };
const nowIso = () => new Date().toISOString();
const clean = (v) => String(v ?? '').replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F]/g, '').trim();
const cleanLine = (v) => clean(v).replace(/\s+/g, ' ');
function checkLen(o, keys, prefix = '') {
  for (const k of keys) if ((o[k] || '').length > LIMITS[k]) throw new AppError('BAD_REQUEST', `${prefix}${LABELS[k]}が長すぎます（${LIMITS[k]}文字まで）。`, { field: k });
}
function personInput(b) {
  const p = {
    name: cleanLine(b.name), nameKana: cleanLine(b.nameKana), department: cleanLine(b.department), title: cleanLine(b.title),
    keywords: tidyKeywords(clean(b.keywords)), receiptName: cleanLine(b.receiptName), memo: clean(b.memo),
  };
  if (!p.name) throw new AppError('BAD_REQUEST', '名前を入力してください。', { field: 'name' });
  checkLen(p, Object.keys(LIMITS));
  return p;
}
function companyInput(b) {
  const c = { name: cleanLine(b.name), nameKana: cleanLine(b.nameKana), keywords: tidyKeywords(clean(b.keywords)), receiptName: cleanLine(b.receiptName), memo: clean(b.memo) };
  if (!c.name) throw new AppError('BAD_REQUEST', '企業名を入力してください。', { field: 'companyName' });
  checkLen({ ...c, name: c.name }, ['name', 'nameKana', 'keywords', 'receiptName', 'memo'], '企業の');
  return c;
}
const personCount = (companyId) => [...S.persons.values()].filter((p) => p.companyId === companyId).length;
function companySummary(c) { return { type: 'company', id: c.id, name: c.name, nameKana: c.nameKana || '', receiptName: c.receiptName || '', keywords: c.keywords || '', personCount: personCount(c.id), createdAt: c.createdAt, updatedAt: c.updatedAt }; }
function personSummary(p) {
  const c = p.companyId ? S.companies.get(p.companyId) : null;
  return { type: 'person', id: p.id, name: p.name, nameKana: p.nameKana || '', companyId: c ? c.id : null, companyName: c ? c.name : '', department: p.department || '', title: p.title || '', receiptName: p.receiptName || '', keywords: p.keywords || '', createdAt: p.createdAt, updatedAt: p.updatedAt };
}

function companyCandidates(name, excludeId = null) {
  const core = companyCore(name);
  const norm = normalize(name);
  if (!core) return [];
  const out = [];
  for (const c of S.companies.values()) {
    if (c.id === excludeId) continue;
    const cc = companyCore(c.name);
    let reason = null;
    if (displayKey(c.name) === displayKey(name)) reason = '同じ企業名';
    else if (normalize(c.name) === norm || cc === core) reason = '表記違いの同名';
    else if ([...core].length >= 4 && editDistance(cc, core) === 1) reason = '1文字違いの企業名';
    if (reason) out.push({ ...companySummary(c), reason });
  }
  return out;
}
function personCandidates(name, companyId, excludeId = null) {
  const norm = normalize(name);
  if (!norm) return [];
  const out = [];
  for (const p of S.persons.values()) {
    if (p.id === excludeId) continue;
    const pn = normalize(p.name);
    const sameCompany = companyId != null && p.companyId === companyId;
    let reason = null;
    if (pn === norm) reason = sameCompany ? '同じ企業に同じ名前' : '同じ名前（別企業または企業なし）';
    else if (sameCompany && [...norm].length >= 3 && editDistance(pn, norm) === 1) reason = '同じ企業に1文字違いの名前';
    if (reason) out.push({ ...personSummary(p), reason, sameCompany });
  }
  return out.sort((a, b) => Number(b.sameCompany) - Number(a.sameCompany) || cmpId(a.id, b.id));
}

async function resolveCompany(spec, { confirmNewCompany }) {
  const mode = spec?.mode || 'none';
  if (mode === 'none') return { companyId: null, company: null };
  if (mode === 'existing') {
    const c = S.companies.get(spec.id);
    if (!c) throw new AppError('COMPANY_NOT_FOUND', '選択した企業が見つかりません。削除された可能性があります。企業を選び直してください。');
    return { companyId: c.id, company: c };
  }
  const c = companyInput({ name: spec.name, nameKana: spec.nameKana });
  const cands = companyCandidates(c.name);
  if (cands.length && !confirmNewCompany) {
    throw new AppError('COMPANY_EXISTS', '同じ（または似た）企業名が既に登録されています。', { candidates: cands });
  }
  const ts = nowIso();
  const id = newId('C', S.companies);
  const doc = { ...c, receiptName: defaultReceiptName('', c.name), memo: '', memoVersion: 0, memoUpdatedAt: null, version: 1, nameHistory: [], imageIds: spec.imageIds || [], createdAt: ts, updatedAt: ts };
  await RT.db.doc(`companies/${id}`).set(doc);
  S.companies.set(id, { id, ...doc });
  return { companyId: id, company: { id, ...doc } };
}

async function createPerson(b) {
  const p = personInput(b);
  const plannedCompanyId = b.company?.mode === 'existing' ? b.company.id : null;
  if (!b.confirmDuplicate) {
    const cands = personCandidates(p.name, plannedCompanyId);
    if (cands.length) throw new AppError('POSSIBLE_DUPLICATE', '同じ（または似た）名前の登録情報があります。', { candidates: cands });
  }
  const imageIds = b.imageId ? [b.imageId] : [];
  const { companyId, company } = await resolveCompany({ ...b.company, imageIds: b.company?.mode === 'new' ? imageIds : [] }, { confirmNewCompany: b.confirmNewCompany });
  const ts = nowIso();
  const id = newId('P', S.persons);
  const doc = {
    ...p, companyId, receiptName: p.receiptName || defaultReceiptName(p.name, company?.name),
    memoVersion: p.memo ? 1 : 0, memoUpdatedAt: p.memo ? ts : null, version: 1, affiliationHistory: [], imageIds, groupIds: validGroupIds(b.groupIds), createdAt: ts, updatedAt: ts,
  };
  await RT.db.doc(`persons/${id}`).set(doc);
  S.persons.set(id, { id, ...doc });
  S.index = null;
  return { type: 'person', id };
}

/** 書き込んだ内容を手元のデータにも反映し、画面をすぐ更新する */
function applyLocal(coll, id, patch) {
  const m = S[coll];
  if (m.has(id)) m.set(id, { ...m.get(id), ...patch });
  S.index = null;
  notify();
}
async function fresh(coll, id) {
  const snap = await RT.db.doc(`${coll}/${id}`).get();
  if (!snap.exists) throw new AppError('NOT_FOUND', 'この登録情報は見つかりません（削除された可能性があります）。');
  return { id, ...snap.data() };
}

async function updatePerson(id, b) {
  const p = personInput(b);
  const cur = await fresh('persons', id);
  if (cur.version !== b.version) throw new AppError('VERSION_CONFLICT', '他の画面または端末でこの登録情報が更新されています。');
  const { companyId, company } = await resolveCompany(b.company, { confirmNewCompany: b.confirmNewCompany });
  const ts = nowIso();
  const patch = {
    name: p.name, nameKana: p.nameKana, department: p.department, title: p.title, keywords: p.keywords,
    receiptName: p.receiptName || defaultReceiptName(p.name, company?.name), companyId, version: cur.version + 1, updatedAt: ts,
  };
  if (Array.isArray(b.groupIds)) patch.groupIds = validGroupIds(b.groupIds);
  if (p.name !== cur.name) patch.nameKanaAuto = '';
  if ((cur.companyId || null) !== (companyId || null)) {
    const oldC = cur.companyId ? S.companies.get(cur.companyId) : null;
    patch.affiliationHistory = [{ oldCompanyId: cur.companyId || null, oldCompanyName: oldC?.name || '', newCompanyId: companyId, newCompanyName: company?.name || '', changedAt: ts }, ...(cur.affiliationHistory || [])].slice(0, 50);
  }
  await RT.db.doc(`persons/${id}`).update(patch);
  applyLocal('persons', id, patch);
  return { type: 'person', id };
}
