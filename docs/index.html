async function updateCompany(id, b) {
  const c = companyInput(b);
  const cur = await fresh('companies', id);
  if (cur.version !== b.version) throw new AppError('VERSION_CONFLICT', '他の画面または端末でこの企業情報が更新されています。');
  if (c.name !== cur.name && !b.confirmDuplicate) {
    const cands = companyCandidates(c.name, id);
    if (cands.length) throw new AppError('COMPANY_EXISTS', '変更後の企業名と同じ（または似た）企業が既に登録されています。', { candidates: cands });
  }
  const ts = nowIso();
  const patch = { name: c.name, nameKana: c.nameKana, keywords: c.keywords, receiptName: c.receiptName || defaultReceiptName('', c.name), version: cur.version + 1, updatedAt: ts };
  if (Array.isArray(b.groupIds)) patch.groupIds = validGroupIds(b.groupIds);
  const affected = [];
  if (c.name !== cur.name) {
    patch.nameHistory = [{ oldName: cur.name, newName: c.name, changedAt: ts }, ...(cur.nameHistory || [])].slice(0, 50);
    patch.nameKanaAuto = '';
  }
  await RT.db.doc(`companies/${id}`).update(patch);
  applyLocal('companies', id, patch);
  if (c.name !== cur.name) {
    // 関連人物の領収証宛名に旧企業名が含まれていれば、指定に応じて置き換える（紐付けはIDなので変わらない）
    for (const p of [...S.persons.values()].filter((x) => x.companyId === id)) {
      const contains = (p.receiptName || '').includes(cur.name);
      let replaced = false;
      if (contains && b.replaceReceiptNames) {
        try {
          const fp = await fresh('persons', p.id);
          await RT.db.doc(`persons/${p.id}`).update({ receiptName: fp.receiptName.split(cur.name).join(c.name), version: fp.version + 1, updatedAt: ts });
          replaced = true;
        } catch (e) { console.warn(e); }
      }
      affected.push({ id: p.id, name: p.name, receiptContainsOldName: contains, replaced });
    }
  }
  return { type: 'company', id, affectedPersons: affected };
}

async function deleteCompany(id, version) {
  const cur = await fresh('companies', id);
  if (version != null && cur.version !== version) throw new AppError('VERSION_CONFLICT', '他の画面または端末でこの企業情報が更新されています。');
  const members = [...S.persons.values()].filter((p) => p.companyId === id);
  if (members.length) throw new AppError('COMPANY_HAS_PERSONS', `この企業には ${members.length} 人の人物が紐付いているため削除できません。先に人物を削除するか、別の企業へ所属を変更してください。`, { persons: members });
  await RT.db.doc(`companies/${id}`).delete();
  await cleanupImages(cur.imageIds || [], id);
}

async function updateMemo(coll, id, memoRaw, memoVersion) {
  const memo = clean(memoRaw);
  if (memo.length > LIMITS.memo) throw new AppError('BAD_REQUEST', `メモが長すぎます（${LIMITS.memo}文字まで）。`);
  const cur = await fresh(coll, id);
  if ((cur.memoVersion || 0) !== memoVersion) {
    throw new AppError('MEMO_CONFLICT', '他の画面または端末でこのメモが更新されています。', { currentMemo: cur.memo || '', memoVersion: cur.memoVersion || 0, memoUpdatedAt: cur.memoUpdatedAt });
  }
  if ((cur.memo || '') === memo) return { memo, memoVersion: cur.memoVersion || 0, memoUpdatedAt: cur.memoUpdatedAt };
  const ts = nowIso();
  const next = { memo, memoVersion: (cur.memoVersion || 0) + 1, memoUpdatedAt: ts, updatedAt: ts };
  await RT.db.doc(`${coll}/${id}`).update(next);
  return next;
}

// 画像: 登録情報から参照されなくなった画像は削除（個人情報を不要に残さない）
async function cleanupImages(imageIds, removedOwnerId) {
  for (const iid of imageIds) {
    const stillUsed = [...S.persons.values(), ...S.companies.values()].some((x) => x.id !== removedOwnerId && (x.imageIds || []).includes(iid));
    if (stillUsed) continue;
    const img = S.images.get(iid);
    try {
      if (img?.assetId && RT.assets) await RT.assets.delete(img.assetId);
      await RT.db.doc(`images/${iid}`).delete();
    } catch (e) { console.warn('画像の削除に失敗', e); }
  }
}

async function saveImage(pending) {
  // pending: { blob, sha256, originalHash, name, ocrText, width, height }
  if (!pending) return null;
  const existing = [...S.images.values()].find((i) => i.sha256 === pending.sha256);
  if (existing) return existing.id;
  if (!RT.assets) return null; // 編集権限がない場合は画像を保存しない
  const up = await RT.assets.upload(pending.blob, { type: 'image/jpeg' });
  const id = newId('I', S.images);
  const doc = {
    assetId: up.id, sha256: pending.sha256, originalHash: pending.originalHash || '', originalName: (pending.name || '').slice(0, 200),
    width: pending.width, height: pending.height, ocrText: (pending.ocrText || '').slice(0, 20000), createdAt: nowIso(),
  };
  await RT.db.doc(`images/${id}`).set(doc);
  S.images.set(id, { id, ...doc });
  return id;
}
function duplicateImageOwners(sha, originalHash) {
  const ids = [...S.images.values()].filter((i) => i.sha256 === sha || (originalHash && (i.originalHash === originalHash || i.sha256 === originalHash))).map((i) => i.id);
  if (!ids.length) return [];
  const out = [];
  for (const p of S.persons.values()) if ((p.imageIds || []).some((x) => ids.includes(x))) out.push({ type: 'person', id: p.id, name: p.name, companyName: S.companies.get(p.companyId)?.name || '' });
  for (const c of S.companies.values()) if ((c.imageIds || []).some((x) => ids.includes(x))) out.push({ type: 'company', id: c.id, name: c.name });
  return out;
}
const imageUrl = (imageId) => { const i = S.images.get(imageId); return i?.assetId ? assetUrl(i.assetId) : null; };

function duplicateGroups() {
  const pg = new Map();
  for (const p of S.persons.values()) { const k = normalize(p.name); if (!pg.has(k)) pg.set(k, []); pg.get(k).push(personSummary(p)); }
  const cg = new Map();
  for (const c of S.companies.values()) { const k = companyCore(c.name); if (!cg.has(k)) cg.set(k, []); cg.get(k).push(companySummary(c)); }
  return {
    persons: [...pg.values()].filter((g) => g.length > 1).map((items) => ({ key: items[0].name, sameCompany: new Set(items.map((i) => i.companyId)).size < items.length, items })),
    companies: [...cg.values()].filter((g) => g.length > 1).map((items) => ({ key: items[0].name, items })),
  };
}
function suggestCompanies(q, limit = 10) {
  const nq = normalize(q); const core = companyCore(q);
  if (!nq) return [];
  const scored = [];
  for (const c of S.companies.values()) {
    const n = normalize(c.name); const cc = companyCore(c.name); const k = normalize(c.nameKana || '');
    let s = 0;
    if (displayKey(c.name) === displayKey(q)) s = 100;
    else if (n === nq || cc === core) s = 90;
    else if (cc.startsWith(core) || n.startsWith(nq) || (k && k.startsWith(nq))) s = 80;
    else if (n.includes(nq) || (core && cc.includes(core)) || (k && k.includes(nq))) s = 70;
    else if ([...core].length >= 4 && editDistance(cc, core) <= 1) s = 50;
    if (s) scored.push({ s, c });
  }
  scored.sort((a, b) => b.s - a.s || cmpId(a.c.id, b.c.id));
  return scored.slice(0, limit).map((x) => companySummary(x.c));
}


// ===================== グループ =====================
// groups/{id}: { name, color(0-7), memo, version, createdAt, updatedAt }
// 所属は人物・企業の groupIds（グループIDの配列）で持つ。グループ名を変えても所属はIDなので変わらない。
const GROUP_COLORS = 8;
const groupList = () => [...S.groups.values()].sort((a, b) => String(a.name).localeCompare(String(b.name), 'ja') || cmpId(a.id, b.id));
const validGroupIds = (ids) => [...new Set((ids || []).filter((g) => S.groups.has(g)))];
function withGroupNames(x) {
  const names = validGroupIds(x.groupIds).map((g) => S.groups.get(g).name);
  return [x.keywords || '', ...names].filter(Boolean).join(', ');
}
function groupMembers(groupId) {
  const persons = [...S.persons.values()].filter((p) => (p.groupIds || []).includes(groupId));
  const companies = [...S.companies.values()].filter((c) => (c.groupIds || []).includes(groupId));
  return { persons, companies, count: persons.length + companies.length };
}
function groupInput(b) {
  const g = { name: cleanLine(b.name), color: Math.max(0, Math.min(GROUP_COLORS - 1, Number(b.color) || 0)), memo: clean(b.memo).slice(0, 2000) };
  if (!g.name) throw new AppError('BAD_REQUEST', 'グループ名を入力してください。', { field: 'groupName' });
  if (g.name.length > 50) throw new AppError('BAD_REQUEST', 'グループ名が長すぎます（50文字まで）。', { field: 'groupName' });
  return g;
}
function groupNameTaken(name, excludeId = null) {
  const n = normalize(name);
  return groupList().find((g) => g.id !== excludeId && normalize(g.name) === n) || null;
}
async function createGroup(b) {
  const g = groupInput(b);
  const dup = groupNameTaken(g.name);
  if (dup) throw new AppError('GROUP_EXISTS', `「${dup.name}」というグループは既にあります。`, { group: dup });
  const ts = nowIso();
  const id = newId('G', S.groups);
  const doc = { ...g, version: 1, createdAt: ts, updatedAt: ts };
  await RT.db.doc(`groups/${id}`).set(doc);
  S.groups.set(id, { id, ...doc });
  S.index = null;
  return { type: 'group', id };
}
async function updateGroup(id, b) {
  const g = groupInput(b);
  const cur = await fresh('groups', id);
  if (cur.version !== b.version) throw new AppError('VERSION_CONFLICT', '他の画面または端末でこのグループが更新されています。');
  const dup = groupNameTaken(g.name, id);
  if (dup) throw new AppError('GROUP_EXISTS', `「${dup.name}」というグループは既にあります。`, { group: dup });
  const gpatch = { ...g, version: cur.version + 1, updatedAt: nowIso() };
  await RT.db.doc(`groups/${id}`).update(gpatch);
  applyLocal('groups', id, gpatch);
  S.index = null;
  return { type: 'group', id };
}
/** 1件の登録情報の所属グループを追加・削除する（登録情報の他の項目は変えない） */
async function setMembership(type, entityId, groupId, on) {
  const coll = type === 'company' ? 'companies' : 'persons';
  const cur = await fresh(coll, entityId);
  const ids = new Set(validGroupIds(cur.groupIds));
  if (on) ids.add(groupId); else ids.delete(groupId);
  const next = [...ids];
  if (JSON.stringify(next) === JSON.stringify(validGroupIds(cur.groupIds))) return false;
  const gp = { groupIds: next, version: (cur.version || 1) + 1, updatedAt: nowIso() };
  await RT.db.doc(`${coll}/${entityId}`).update(gp);
  applyLocal(coll, entityId, gp);
  return true;
}
/** 複数件をまとめて追加・削除（1件ずつ順番に書き込み、失敗したら止めて件数を返す） */
async function setMembershipMany(items, groupId, on, progress) {
  let done = 0;
  for (const it of items) {
    await setMembership(it.type, it.id, groupId, on);
    done++;
    progress?.(done, items.length);
  }
  S.index = null;
  return done;
}
async function deleteGroup(id, progress) {
  const m = groupMembers(id);
  const items = [...m.persons.map((p) => ({ type: 'person', id: p.id })), ...m.companies.map((c) => ({ type: 'company', id: c.id }))];
  await setMembershipMany(items, id, false, progress); // 先に所属を外す（登録情報そのものは削除しない）
  await RT.db.doc(`groups/${id}`).delete();
  S.groups.delete(id);
  S.index = null;
}

// ===== まとめて選択 → 宛名を一括表示（複数人から同時に領収証を頼まれたとき用） =====
// 選択はこの端末の画面内だけ（タブを閉じるまで保持）。登録情報には何も書き込まない。

const SEL = new Map(); // key "person:ID" / "company:ID" → { type, id, done }
const selListeners = new Set();
const SEL_KEY = 'receipt-selection';
try { for (const x of JSON.parse(sessionStorage.getItem(SEL_KEY) || '[]')) SEL.set(`${x.type}:${x.id}`, x); } catch { /* 保存できない環境では保持しない */ }
function selSave() { try { sessionStorage.setItem(SEL_KEY, JSON.stringify([...SEL.values()])); } catch { /* noop */ } }
function selNotify() { selSave(); for (const fn of [...selListeners]) { try { fn(); } catch (e) { console.error(e); } } }
const onSelChange = (fn) => { selListeners.add(fn); return () => selListeners.delete(fn); };
const isSel = (type, id) => SEL.has(`${type}:${id}`);
function setSel(type, id, on) {
  const k = `${type}:${id}`;
  if (on && !SEL.has(k)) SEL.set(k, { type, id, done: false });
  if (!on) SEL.delete(k);
}
function toggleSel(type, id, on) { setSel(type, id, on); selNotify(); }
function selectMany(items, on = true) { for (const x of items) setSel(x.type, x.id, on); selNotify(); }
function clearSel() { SEL.clear(); selNotify(); }
/** 選択中で、今も存在する登録情報（選んだ順） */
function selItems() {
  const out = [];
  for (const s of SEL.values()) {
    if (s.type === 'person') {
      const p = S.persons.get(s.id); if (!p) continue;
      const c = p.companyId ? S.companies.get(p.companyId) : null;
      out.push({ ...s, receipt: p.receiptName || defaultReceiptName(p.name, c?.name), person: p.name, company: c?.name || '', ref: p });
    } else {
      const c = S.companies.get(s.id); if (!c) continue;
      out.push({ ...s, receipt: c.receiptName || defaultReceiptName('', c.name), person: '', company: c.name, ref: c });
    }
  }
  return out;
}

/** 行に付けるチェック欄 */
function selCheckbox(type, id, label) {
  const cb = h('input', { type: 'checkbox', class: 'sel-cb', checked: isSel(type, id), 'aria-label': `${label}を選択`, 'data-key': `${type}:${id}` });
  cb.addEventListener('click', (e) => e.stopPropagation());
  cb.addEventListener('change', () => toggleSel(type, id, cb.checked));
  return h('label', { class: 'sel-box', title: '選択（まとめて宛名を表示）', onclick: (e) => e.stopPropagation() }, cb);
}
/** 一覧の「すべて選択／解除」ボタン */
function selectAllButton(getItems, label = 'すべて選択') {
  const btn = h('button', { type: 'button', class: 'btn btn-ghost btn-sm' });
  let off = null;
  const render = () => {
    if (off && !btn.isConnected) { off(); return; } // 画面から消えたら購読をやめる
    const items = getItems();
    const all = items.length && items.every((x) => isSel(x.type, x.id));
    btn.textContent = all ? '選択を外す' : label;
    btn.disabled = !items.length;
  };
  btn.addEventListener('click', () => { const items = getItems(); const all = items.every((x) => isSel(x.type, x.id)); selectMany(items, !all); });
  render();
  off = onSelChange(render);
  return btn;
}

// ---------- 画面下の選択バー ----------
function mountSelectionBar() {
  const count = h('strong', {});
  const bar = h('div', { class: 'sel-bar', role: 'region', 'aria-label': '選択中の登録情報', hidden: true }, [
    h('span', { class: 'sel-count' }, [count, '件を選択中']),
    h('button', { type: 'button', class: 'btn btn-primary', onclick: () => showSelected() }, '対象を表示'),
    h('button', { type: 'button', class: 'btn btn-ghost', onclick: () => clearSel() }, '選択を解除'),
  ]);
  document.body.append(bar);
  const render = () => {
    // 画面上のチェック欄を選択状態に合わせる（別の画面で選んだ・解除した場合も）
    document.querySelectorAll('.sel-cb[data-key]').forEach((cb) => { cb.checked = SEL.has(cb.dataset.key); });
    const n = selItems().length;
    count.textContent = String(n);
    bar.hidden = n === 0;
    document.body.classList.toggle('has-sel-bar', n > 0);
  };
  onSelChange(render);
  onData(render);
  render();
}

// ---------- 一括表示（ポップアップ） ----------
async function showSelected() {
  const list = h('ol', { class: 'sel-list' });
  const summary = h('span', { class: 'small muted' });
  function render() {
    const items = selItems();
    const done = items.filter((x) => x.done).length;
    summary.textContent = `${items.length}件（発行済み ${done}件）`;
    fill(list, items.map((x, i) => {
      const receiptEl = h('div', { class: 'sel-receipt' }, x.receipt);
      const doneCb = h('input', { type: 'checkbox', checked: x.done, 'aria-label': `${x.receipt}を発行済みにする` });
      doneCb.addEventListener('change', () => { const s = SEL.get(`${x.type}:${x.id}`); if (s) s.done = doneCb.checked; selSave(); render(); });
      return h('li', { class: `sel-item ${x.done ? 'is-done' : ''}` }, [
        h('div', { class: 'sel-num' }, String(i + 1)),
        h('div', { class: 'sel-body' }, [
          h('div', { class: 'rc-row' }, [h('span', { class: 'rc-label' }, '宛名'), receiptEl]),
          x.person ? h('div', { class: 'rc-row' }, [h('span', { class: 'rc-label' }, '人物'), h('span', {}, x.person)]) : null,
          h('div', { class: 'rc-row' }, [h('span', { class: 'rc-label' }, '企業名'), h('span', {}, x.company || h('span', { class: 'muted' }, '企業の登録なし'))]),
        ]),
        h('div', { class: 'sel-actions' }, [
          h('button', { type: 'button', class: 'btn btn-secondary btn-sm', onclick: () => copyText(x.receipt, receiptEl) }, 'コピー'),
          h('label', { class: 'sel-done' }, [doneCb, ' 発行済み']),
          h('button', { type: 'button', class: 'btn btn-xs btn-danger-ghost', onclick: () => { toggleSel(x.type, x.id, false); render(); } }, '外す'),
        ]),
      ]);
    }));
    if (!items.length) list.append(h('li', { class: 'muted' }, '選択中の登録情報はありません。'));
  }
  render();
  const allBtn = h('button', { type: 'button', class: 'btn btn-primary btn-sm', onclick: (e) => copyText(selItems().map((x) => x.receipt).join('\n'), list) }, 'すべての宛名をコピー');
  const allWithName = h('button', { type: 'button', class: 'btn btn-ghost btn-sm', onclick: () => copyText(selItems().map((x) => [x.receipt, x.person, x.company].join('\t')).join('\n'), list) }, '人物・企業名つきでコピー');
  const v = await dialog({
    title: 'まとめて表示（領収証の宛名）',
    body: [
      h('div', { class: 'row sel-head' }, [summary, allBtn, allWithName]),
      h('p', { class: 'small muted' }, '書き終えたものに「発行済み」の印を付けられます（この端末の画面内だけの印で、登録情報は変わりません）。'),
      list,
    ],
    buttons: [{ label: '選択を解除して閉じる', value: 'clear' }, { label: '閉じる', value: true, kind: 'primary' }],
  });
  if (v === 'clear') clearSel();
}

// ===== 人物の顔写真 =====
// 写真は正方形に切り抜いて（400×400px）このページの保存領域（assets）に保存し、人物の photo.assetId で紐付ける。
// 名刺から自動で顔を探すことはしない（誤った切り抜きを防ぐため、利用者が範囲を決める）。

const PHOTO_SIZE = 400;
const photoUrl = (p) => (p?.photo?.assetId ? assetUrl(p.photo.assetId) : null);

/** 丸い顔写真（なければ頭文字） */
function avatar(p, size = 'md') {
  const url = photoUrl(p);
  const initial = String(p?.name || '?').replace(/^[（(].*?[）)]/, '').trim().slice(0, 1) || '?';
  if (url) {
    const img = h('img', { class: `avatar avatar-${size}`, src: url, alt: `${p.name}の写真`, loading: 'lazy' });
    img.addEventListener('error', () => { img.replaceWith(h('span', { class: `avatar avatar-${size} avatar-empty`, 'aria-hidden': 'true' }, initial)); });
    return img;
  }
  return h('span', { class: `avatar avatar-${size} avatar-empty`, 'aria-hidden': 'true' }, initial);
}

/** 顔写真を大きく表示する（写真がなければ追加の画面へ） */
async function showPersonPhoto(p) {
  const cur = S.persons.get(p.id) || p;
  const url = photoUrl(cur);
  if (!url) { choosePersonPhoto(cur); return; }
  const c = cur.companyId ? S.companies.get(cur.companyId) : null;
  const v = await dialog({
    title: `${cur.name}の写真`,
    body: (done) => {
      const img = h('img', { class: 'photo-zoom', src: url, alt: `${cur.name}の写真` });
      img.addEventListener('click', () => done(null));
      return [img, c ? h('p', { class: 'small muted photo-zoom-cap' }, c.name) : null];
    },
    buttons: [{ label: '写真を変更', value: 'change' }, { label: '閉じる', value: true, kind: 'primary' }],
  });
  if (v === 'change') choosePersonPhoto(cur);
}
/** 一覧の小さい写真: タップで拡大（行全体のタップ＝詳細を開く、とは別に動く） */
function zoomableAvatar(p, size) {
  const a = avatar(p, size);
  if (!photoUrl(p)) return a;
  const w = h('span', { class: 'avatar-zoom', role: 'button', tabindex: '0', title: '写真を拡大', 'aria-label': `${p.name}の写真を拡大` }, a);
  const open = (e) => { e.stopPropagation(); e.preventDefault(); showPersonPhoto(p); };
  w.addEventListener('click', open);
  w.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') open(e); });
  return w;
}

async function setPersonPhoto(personId, blob) {
  if (!RT.assets) throw new AppError('NO_ASSETS', 'このアカウントでは写真を保存できません（ページの所有者・編集者のみ保存できます）。');
  const cur = await fresh('persons', personId);
  const up = await RT.assets.upload(blob, { type: 'image/jpeg' });
  const patch = { photo: { assetId: up.id, updatedAt: nowIso() }, version: (cur.version || 1) + 1, updatedAt: nowIso() };
  await RT.db.doc(`persons/${personId}`).update(patch);
  applyLocal('persons', personId, patch);
  if (cur.photo?.assetId && cur.photo.assetId !== up.id) await deletePhotoAsset(cur.photo.assetId, null);
}
async function removePersonPhoto(personId) {
  const cur = await fresh('persons', personId);
  if (!cur.photo?.assetId) return;
  const patch = { photo: null, version: (cur.version || 1) + 1, updatedAt: nowIso() };
  await RT.db.doc(`persons/${personId}`).update(patch);
  applyLocal('persons', personId, patch);
  await deletePhotoAsset(cur.photo.assetId, personId);
}
async function deletePhotoAsset(assetId, excludeId = null) {
  // 他の人物が同じ写真を使っていなければ削除（使っていれば残す）
  const used = [...S.persons.values()].some((p) => p.id !== excludeId && p.photo?.assetId === assetId);
  if (used || !RT.assets) return;
  try { await RT.assets.delete(assetId); } catch (e) { console.warn('写真の削除に失敗', e); }
}

/** 写真の用意方法を選ぶ → 切り抜き → 保存 */
async function choosePersonPhoto(p) {
  if (!RT.assets) {
    await dialog({ title: '写真を保存できません', body: h('p', {}, 'このアカウントでは写真を保存できません。ページの所有者、または編集者として招待されたアカウントで操作してください。'), buttons: [{ label: '閉じる', value: true, kind: 'primary' }] });
    return;
  }
  const cards = (p.imageIds || []).map((i) => [i, imageUrl(i)]).filter(([, u]) => u);
  const source = await dialog({
    title: `${p.name}の写真`,
    body: (done) => [
      h('p', { class: 'small muted' }, '写真を用意する方法を選んでください。次の画面で、顔の部分を正方形に切り抜きます。'),
      h('div', { class: 'photo-sources' }, [
        cards.length ? h('div', { class: 'photo-source' }, [
          h('div', { class: 'field-label' }, '名刺画像から切り抜く'),
          h('div', { class: 'thumbs' }, cards.map(([i, u]) => h('button', { type: 'button', class: 'thumb-btn', onclick: () => done({ kind: 'card', url: u, imageId: i }) }, h('img', { class: 'thumb', src: u, alt: '取り込み元画像' })))),
        ]) : null,
        h('button', { type: 'button', class: 'btn btn-secondary', onclick: () => done({ kind: 'camera' }) }, 'カメラで撮影'),
        h('button', { type: 'button', class: 'btn btn-secondary', onclick: () => done({ kind: 'file' }) }, '保存済みの画像を選ぶ'),
      ]),
    ],
    buttons: [{ label: 'キャンセル', value: null }],
  });
  if (!source) return;
  let bitmap;
  try {
    if (source.kind === 'card') {
      const res = await fetch(source.url);
      if (!res.ok) throw new AppError('LOAD', '名刺画像を読み込めませんでした。');
      bitmap = await createImageBitmap(await res.blob());
    } else {
      const file = await pickImageFile(source.kind === 'camera');
      if (!file) return;
      bitmap = (await loadImageFile(file)).source;
    }
  } catch (e) {
    toast(e instanceof AppError ? e.message : `画像を読み込めませんでした。${SUPPORTED_LABEL} の画像でお試しください。`, 'error', 6000);
    return;
  }
  const blob = await cropSquare(bitmap, { title: source.kind === 'card' ? '名刺から顔の部分を切り抜く' : '写真を切り抜く' });
  if (!blob) return;
  try {
    await setPersonPhoto(p.id, blob);
    toast('写真を保存しました', 'success');
  } catch (e) {
    toast(`写真を保存できませんでした: ${e instanceof AppError ? e.message : dbErrorMessage(e)}`, 'error', 7000);
  }
}

/**
 * 正方形の切り抜き画面。枠をドラッグして移動、スライダーで大きさを変える。
 * @returns {Promise<Blob|null>} 400×400 の JPEG
 */
function cropSquare(source, { title = '写真を切り抜く' } = {}) {
  return new Promise((resolve) => {
    let src = source;
    let rot = 0;
    const view = document.createElement('canvas');
    view.className = 'crop-canvas';
    const preview = document.createElement('canvas');
    preview.width = preview.height = 120;
    preview.className = 'crop-preview';
    const sizeRange = h('input', { type: 'range', min: '10', max: '100', value: '50', id: 'crop-size', 'aria-label': '切り抜く大きさ' });
    let W = 0; let H = 0; let scale = 1; // 画像の大きさ・表示倍率
    let sel = { x: 0, y: 0, s: 0 }; // 画像上の正方形（左上・一辺）

    function rotated() {
      // 回転した画像を作り直す（90度単位）
      if (rot === 0) return source;
      const c = document.createElement('canvas');
      c.width = rot % 180 === 0 ? source.width : source.height;
      c.height = rot % 180 === 0 ? source.height : source.width;
      const x = c.getContext('2d');
      if (rot === 90) x.setTransform(0, 1, -1, 0, source.height, 0);
      else if (rot === 180) x.setTransform(-1, 0, 0, -1, source.width, source.height);
      else x.setTransform(0, -1, 1, 0, 0, source.width);
      x.drawImage(source, 0, 0);
      return c;
    }
    function layout(resetSel) {
      src = rotated();
      W = src.width; H = src.height;
      const maxW = Math.min(520, window.innerWidth - 64);
      const maxH = Math.min(420, window.innerHeight * 0.5);
      scale = Math.min(maxW / W, maxH / H, 1);
      view.width = Math.round(W * scale); view.height = Math.round(H * scale);
      if (resetSel) {
        const s = Math.round(Math.min(W, H) * (Number(sizeRange.value) / 100));
        sel = { x: Math.round((W - s) / 2), y: Math.round((H - s) / 2), s };
      }
      draw();
    }
    function clamp() {
      sel.s = Math.max(16, Math.min(sel.s, W, H));
      sel.x = Math.max(0, Math.min(sel.x, W - sel.s));
      sel.y = Math.max(0, Math.min(sel.y, H - sel.s));
    }
    function draw() {
      clamp();
      const c = view.getContext('2d');
      c.clearRect(0, 0, view.width, view.height);
      c.drawImage(src, 0, 0, view.width, view.height);
      c.fillStyle = 'rgba(0,0,0,.5)';
      const sx = sel.x * scale; const sy = sel.y * scale; const ss = sel.s * scale;
      c.fillRect(0, 0, view.width, sy); c.fillRect(0, sy + ss, view.width, view.height - sy - ss);
      c.fillRect(0, sy, sx, ss); c.fillRect(sx + ss, sy, view.width - sx - ss, ss);
      c.strokeStyle = '#fff'; c.lineWidth = 2; c.strokeRect(sx + 1, sy + 1, ss - 2, ss - 2);
      c.beginPath(); c.arc(sx + ss / 2, sy + ss / 2, ss / 2 - 2, 0, Math.PI * 2); c.setLineDash([6, 6]); c.stroke(); c.setLineDash([]);
      const pc = preview.getContext('2d');
      pc.clearRect(0, 0, 120, 120);
      pc.drawImage(src, sel.x, sel.y, sel.s, sel.s, 0, 0, 120, 120);
    }
    // ドラッグで移動（マウス・タッチ共通）
    let drag = null;
    view.addEventListener('pointerdown', (e) => {
      const r = view.getBoundingClientRect();
      const px = (e.clientX - r.left) / scale; const py = (e.clientY - r.top) / scale;
      // 枠の外を押したら、その位置に枠を移動
      if (px < sel.x || px > sel.x + sel.s || py < sel.y || py > sel.y + sel.s) { sel.x = px - sel.s / 2; sel.y = py - sel.s / 2; draw(); }
      drag = { px, py, x: sel.x, y: sel.y };
      view.setPointerCapture(e.pointerId);
      e.preventDefault();
    });
    view.addEventListener('pointermove', (e) => {
      if (!drag) return;
      const r = view.getBoundingClientRect();
      const px = (e.clientX - r.left) / scale; const py = (e.clientY - r.top) / scale;
      sel.x = drag.x + (px - drag.px); sel.y = drag.y + (py - drag.py); draw();
    });
    const endDrag = () => { drag = null; };
    view.addEventListener('pointerup', endDrag);
    view.addEventListener('pointercancel', endDrag);
    sizeRange.addEventListener('input', () => {
      const cx = sel.x + sel.s / 2; const cy = sel.y + sel.s / 2;
      sel.s = Math.round(Math.min(W, H) * (Number(sizeRange.value) / 100));
      sel.x = cx - sel.s / 2; sel.y = cy - sel.s / 2; draw();
    });
    // キーボードでも移動できる
    view.tabIndex = 0;
    view.addEventListener('keydown', (e) => {
      const step = Math.max(4, Math.round(sel.s / 20));
      const d = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] }[e.key];
      if (d) { e.preventDefault(); sel.x += d[0]; sel.y += d[1]; draw(); }
    });

    dialog({
      title,
      body: [
        h('p', { class: 'small muted' }, '白い枠をドラッグして顔の位置に合わせ、スライダーで大きさを調整してください（丸い点線の内側が表示されます）。'),
        h('div', { class: 'crop-wrap' }, [view, h('div', { class: 'crop-side' }, [h('div', { class: 'small muted' }, '表示の見本'), preview])]),
        h('div', { class: 'row' }, [h('label', { for: 'crop-size', class: 'small' }, '大きさ'), sizeRange,
          h('button', { type: 'button', class: 'btn btn-ghost btn-sm', onclick: () => { rot = (rot + 90) % 360; layout(true); } }, '⟳ 回転')]),
      ],
      buttons: [
        { label: 'キャンセル', value: null },
        { label: 'この範囲で保存', kind: 'primary', value: () => sel },
      ],
    }).then((v) => {
      if (!v) { resolve(null); return; }
      const out = document.createElement('canvas');
      out.width = out.height = PHOTO_SIZE;
      const x = out.getContext('2d');
      x.imageSmoothingQuality = 'high';
      x.drawImage(src, sel.x, sel.y, sel.s, sel.s, 0, 0, PHOTO_SIZE, PHOTO_SIZE);
      try {
        out.toBlob((b) => resolve(b), 'image/jpeg', 0.9);
      } catch {
        toast('この画像は切り抜けませんでした。別の画像でお試しください。', 'error');
        resolve(null);
      }
    });
    requestAnimationFrame(() => layout(true));
  });
}

// ===== グループ分け: 画面部品 =====

const GROUP_COLOR_NAMES = ['青', '緑', '橙', '赤', '紫', '水色', '茶', '灰'];

function groupChip(g, { onClick, count, small = false } = {}) {
  const label = count != null ? [h('span', { class: 'gdot', 'aria-hidden': 'true' }), g.name, h('span', { class: 'gcount' }, String(count))] : [h('span', { class: 'gdot', 'aria-hidden': 'true' }), g.name];
  return onClick
    ? h('button', { type: 'button', class: `gchip g${g.color || 0} ${small ? 'gchip-sm' : ''}`, onclick: onClick }, label)
    : h('span', { class: `gchip g${g.color || 0} ${small ? 'gchip-sm' : ''}` }, label);
}
/** 所属グループのチップ一覧（クリックでグループ画面へ） */
function groupChips(ids, { small = false, empty = null } = {}) {
  const gs = validGroupIds(ids).map((g) => S.groups.get(g)).sort((a, b) => String(a.name).localeCompare(String(b.name), 'ja'));
  if (!gs.length) return empty;
  return h('span', { class: 'chips' }, gs.map((g) => groupChip(g, { small, onClick: (e) => { e.stopPropagation(); go('group', { id: g.id }); } })));
}

/** 登録・編集画面のグループ選択（タップで切り替え。新しいグループもその場で作れる） */
function groupPicker(initialIds = []) {
  let selected = new Set(validGroupIds(initialIds));
  const box = h('div', { class: 'chips gpicker' });
  const newName = h('input', { type: 'text', class: 'input input-inline', placeholder: '新しいグループ名', maxlength: 50, 'aria-label': '新しいグループ名' });
  const addBtn = h('button', { type: 'button', class: 'btn btn-xs' }, '＋ 作成して追加');
  const msg = h('div', { class: 'small warn-text', role: 'status' });
  function render() {
    const gs = groupList();
    fill(box, gs.length ? gs.map((g) => {
      const on = selected.has(g.id);
      return h('button', { type: 'button', class: `gchip g${g.color || 0} gtoggle ${on ? 'on' : ''}`, 'aria-pressed': String(on), onclick: () => { if (on) selected.delete(g.id); else selected.add(g.id); render(); } },
        [h('span', { class: 'gcheck', 'aria-hidden': 'true' }, on ? '✓' : '＋'), g.name]);
    }) : h('span', { class: 'small muted' }, 'まだグループがありません。下で作成できます。'));
  }
  addBtn.addEventListener('click', async () => {
    msg.textContent = '';
    const name = newName.value.trim();
    if (!name) { msg.textContent = 'グループ名を入力してください。'; return; }
    const exist = groupNameTaken(name);
    if (exist) { selected.add(exist.id); newName.value = ''; render(); msg.textContent = `「${exist.name}」は既にあるため、それを選びました。`; return; }
    addBtn.disabled = true;
    try {
      const r = await createGroup({ name, color: S.groups.size % GROUP_COLORS });
      selected.add(r.id); newName.value = ''; render();
      toast(`グループ「${name}」を作成しました`, 'success');
    } catch (e) { msg.textContent = dbErrorMessage(e); } finally { addBtn.disabled = false; }
  });
  newName.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); addBtn.click(); } });
  render();
  const off = onData(render);
  const wrap = h('div', { class: 'field' }, [
    h('div', { class: 'field-label' }, 'グループ（任意・複数選べます）'),
    box,
    h('div', { class: 'row gnew' }, [newName, addBtn]),
    msg,
  ]);
  return { wrap, value: () => validGroupIds([...selected]), key: () => JSON.stringify(validGroupIds([...selected]).sort()), cleanup: off };
}

  const m = groupMembers(groupId);

// ===== 一覧から一括登録（メモアプリの表の貼り付け・一覧の画像） =====
// 流れ: ①貼り付け／画像 → ②行ごとの表で修正 → ③確認画面（チェック必須） → ④登録
// 方針: 企業は文字列で自動的に同一と判断しない（既存企業と同名なら「紐付け／新規」を行ごとに選ばせる）。
//       同じ名前の人物が既にいる行は、初期状態で「登録しない」にして確認を求める。

/** 貼り付けた文字を「企業名・名前」の行に分ける */
function parseBulkText(text) {
  const rows = [];
  for (const raw of String(text || '').replace(/\r\n?/g, '\n').split('\n')) {
    const line = raw.replace(/ /g, ' ').trim();
    if (!line) continue;
    if (/^(企業名|会社名|会社)\s*[\t,、　 ]\s*(名前|氏名|担当)/.test(line)) continue; // 見出し行
    let company = ''; let name = ''; let split = false;
    // 区切りの優先順: タブ → カンマ → 全角空白 → 半角空白2つ以上（最初の区切りだけで分ける）
    for (const re of [/\t+/, /\s*[,，]\s*/, /　+/, / {2,}/]) {
      const m = line.match(re);
      if (m) { company = line.slice(0, m.index).trim(); name = line.slice(m.index + m[0].length).trim(); split = true; break; }
    }
    if (!split) company = line;
    rows.push({ company: cleanLine(company), name: cleanLine(name.replace(/\t+/g, ' ')), uncertain: !split || !name, note: !split ? '区切りが見つからない行です。名前の欄を確認してください（上下の行と結合もできます）' : '' });
  }
  return rows;
}

const BULK_LIST_PROMPT = `添付画像は「企業名」と「名前（担当者）」の2列の一覧表（スマートフォンのメモなど）です。
次の規則を必ず守り、JSONだけを返してください。
- 表の各行を上から順に、書かれている通りに書き写す。「さん」「くん」「ちゃん」などの敬称や愛称もそのまま残す。推測・補完をしない。
- 1つのセルが2行に折り返されている場合は、1つのセルとして空白1つでつなぐ。
- 文字が隠れている・欠けている・判読に迷う行は uncertain を true にし、読めない文字は「?」にする。
- 見出し行（あれば）は含めない。
形式: {"rows":[{"company":"…","name":"…","uncertain":false}]}`;

function createBulkImport({ onDone, presetGroupIds = [] }) {
  const groups = groupPicker(presetGroupIds);
  let rows = []; // {key, include, company, name, uncertain, note, link: 'auto'|'new'|companyId}
  let seq = 0;
  let stage = 'input';
  const root = h('div');
  const textarea = h('textarea', { id: 'bulk-text', class: 'bulk-text', rows: 8, placeholder: '例）メモアプリの表を選択してコピーし、ここに貼り付けます。\n株式会社あおば設備	青木さん\n（有）さくら園芸	けんくん\n\n1行に「企業名」と「名前」を、タブ・カンマ・全角スペースのどれかで区切って書いても構いません。' });
  const keywords = h('input', { id: 'bulk-keywords', class: 'input', type: 'text', placeholder: '例: 青年部', maxlength: 200 });
  const receiptFmt = h('select', { id: 'bulk-receipt', class: 'input' }, [
    h('option', { value: 'company-sama' }, '企業名 様（例: 株式会社サンプル 様）'),
    h('option', { value: 'company-onchu' }, '企業名 御中（例: 株式会社サンプル 御中）'),
    h('option', { value: 'company-person' }, '企業名 名前 様（例: 株式会社サンプル 山田さん 様）'),
  ]);
  const imgStatus = h('div', { 'aria-live': 'polite' });
  const err = h('div', { class: 'notice notice-error', role: 'alert', hidden: true });
  const showErr = (m) => { err.textContent = m; err.hidden = !m; if (m) err.scrollIntoView({ behavior: 'smooth', block: 'center' }); };

  const ensureExtra = (r) => (r.extra ||= { nameKana: '', department: '', title: '', receiptName: null, keywords: '', memo: '', groupIds: [] });
  const rowGroups = (r) => validGroupIds([...groups.value(), ...((r.extra && r.extra.groupIds) || [])]);
  const rowKeywords = (r) => tidyKeywords([keywords.value, r.extra?.keywords || ''].filter(Boolean).join(', '));
  const rowReceipt = (r) => (r.extra?.receiptName != null && r.extra.receiptName !== '' ? r.extra.receiptName : receiptFor(r.company, r.name));
  const receiptFor = (company, name) => {
    const c = cleanLine(company); const n = cleanLine(name);
    if (receiptFmt.value === 'company-onchu') return c ? `${c} 御中` : `${n} 様`;
    if (receiptFmt.value === 'company-person') return defaultReceiptName(n, c);
    return c ? `${c} 様` : `${n} 様`;
  };

  // 行の状態（既存企業の候補・重複の可能性）を計算
  function analyze(r) {
    const cands = r.company ? companyCandidates(r.company) : [];
    const exact = cands.filter((c) => c.reason === '同じ企業名' || c.reason === '表記違いの同名');
    let linkId = null;
    if (r.link && r.link !== 'auto' && r.link !== 'new') linkId = S.companies.has(r.link) ? r.link : null;
    else if (r.link === 'auto' && exact.length === 1) linkId = exact[0].id;
    const dupPersons = r.name ? personCandidates(r.name, linkId).filter((p) => p.sameCompany || normalize(p.name) === normalize(r.name)) : [];
    return { cands, exact, linkId, dupPersons };
  }

  function addRows(list) {
    for (const x of list) {
      const r = { key: ++seq, include: true, company: x.company || '', name: x.name || '', uncertain: !!x.uncertain, note: x.note || (x.uncertain ? '画像の文字が隠れている・判読に迷う行です。画像と見比べてください' : ''), link: 'auto' };
      const a = analyze(r);
      if (a.dupPersons.some((p) => p.sameCompany)) { r.include = false; r.note = `${r.note ? `${r.note}。` : ''}同じ企業に同じ名前の登録情報があるため、初期状態では登録しません`; }
      if (!r.company && !r.name) continue;
      rows.push(r);
    }
  }

  // ---------- ① 入力 ----------

    stage = 'input';
    fill(root,
      h('section', { class: 'card' }, [
        h('h2', { class: 'card-title' }, '① 一覧を貼り付ける'),
        h('p', { class: 'small muted' }, 'メモアプリなどの表を選択してコピーし、下の欄に貼り付けてください。1行が1人分になります。'),

  async function readImage() {
    showErr('');
    const file = await pickImageFile(false);
    if (!file) return;
    let img;
    try { const l = await loadImageFile(file); img = await renderImage(l.source, 0); } catch (e) { fill(imgStatus, h('div', { class: 'notice notice-error' }, e.message)); return; }
    const why = sampleUnavailableReason();
    if (!why && !IS_LOCAL) {
      fill(imgStatus, loading('Claudeが一覧を読み取っています…（通常10〜60秒）'));
      try {
        const r = await RT.sample.json(BULK_LIST_PROMPT, { images: [img.blob] });
        const list = (Array.isArray(r?.rows) ? r.rows : []).map((x) => ({ company: cleanLine(x.company), name: cleanLine(x.name), uncertain: !!x.uncertain })).filter((x) => x.company || x.name);
        if (!list.length) { fill(imgStatus, h('div', { class: 'notice notice-error' }, '一覧を読み取れませんでした。表がはっきり写った画像でお試しいただくか、文字を貼り付けてください。')); return; }
        fill(imgStatus, h('div', { class: 'notice notice-info small' }, `${list.length}行を読み取りました。次の表で、画像と見比べて確認してください。`));
        rows = []; addRows(list); renderTable();
        return;
      } catch (e) {
        if (e?.code === 'cancelled') return;
        fill(imgStatus, h('div', { class: 'notice notice-warn small' }, `Claudeで読み取れなかったため（コード: ${e?.code || '不明'}）、端末内で読み取ります。`));
      }
    }
    // 端末内で読み取り、結果は貼り付け欄に入れて利用者に整えてもらう（表の列の判定は推測しない）
    fill(imgStatus, imgStatus.firstChild, loading('端末内で文字を読み取っています…'));
    try {
      const w = await getTessWorker();
      const { data } = await w.recognize(img.blob, {}, { text: true });
      const text = String(data.text || '').split('\n').map((l) => cleanText(l)).filter(Boolean).join('\n');
      textarea.value = text;
      fill(imgStatus, h('div', { class: 'notice notice-warn small' }, [why ? `${why} ` : '', '端末内で読み取った文字を上の欄に入れました。端末内の読み取りでは表の列を正確に判定できないため、「企業名」と「名前」の間に全角スペースを入れるなど整えてから「表に分ける」を押してください。']));
    } catch (e) {
      fill(imgStatus, h('div', { class: 'notice notice-error' }, `画像を読み取れませんでした（${e?.message || e}）。メモアプリから文字をコピーして貼り付けてください。`));
    }
  }

  /** 1行の詳細編集（通常の登録画面と同じ項目） */
  async function editRow(r, onSaved) {
    const ex = ensureExtra(r);
    const name = textField('name', '名前', { value: r.name, maxlength: 100, placeholder: '空欄にすると企業のみの登録になります' });
    const kana = kanaField('nameKana', '読み（任意）', () => name.value || company.value, ex.nameKana);
    const company = textField('companyName', '企業名', { value: r.company, maxlength: 100, hint: '登録済みの企業に紐付けるかどうかは、表の「企業の扱い」で選びます。' });
    const dept = textField('department', '部署（任意）', { value: ex.department, maxlength: 100 });
    const title = textField('title', '役職（任意）', { value: ex.title, maxlength: 100 });
    const autoCb = h('input', { type: 'checkbox', checked: ex.receiptName == null || ex.receiptName === '', id: 'bulk-receipt-auto' });
    const receipt = textField('receiptName', '領収証宛名', { value: rowReceipt(r), maxlength: 200 });
    const syncReceipt = () => { if (autoCb.checked) receipt.value = receiptFor(company.value, name.value); receipt.input.readOnly = autoCb.checked; receipt.input.classList.toggle('readonly', autoCb.checked); };
    autoCb.addEventListener('change', syncReceipt);
    name.input.addEventListener('input', syncReceipt);
    company.input.addEventListener('input', syncReceipt);
    receipt.wrap.append(h('label', { class: 'check small', for: 'bulk-receipt-auto' }, [autoCb, ' 一覧の設定（共通の「領収証宛名の書き方」）で自動作成する']));
    const gp = groupPicker(ex.groupIds);
    const common = groups.value();
    const kw = textField('keywords', 'キーワード（任意）', { value: ex.keywords, maxlength: 1000, hint: keywords.value.trim() ? `共通のキーワード「${tidyKeywords(keywords.value)}」も付きます。` : '複数ある場合は「,」や「、」で区切ってください。' });
    const memo = textField('memo', 'メモ（任意）', { multiline: true, value: ex.memo, maxlength: 100000 });
    syncReceipt();
    const v = await dialog({
      title: `${r.name || r.company || '新しい行'} の詳細`,
      body: [
        h('div', { class: 'grid-2' }, [name.wrap, kana.wrap]),
        company.wrap,
        h('div', { class: 'grid-2' }, [dept.wrap, title.wrap]),
        receipt.wrap,
        gp.wrap,
        common.length ? h('p', { class: 'small muted' }, ['共通のグループ ', groupChips(common, { small: true }), ' も付きます。']) : null,
        kw.wrap,
        memo.wrap,
        h('p', { class: 'small muted' }, 'まだ登録はされません。「③ 確認へ進む」の確認画面で内容を確かめてから登録します。'),
      ],
      buttons: [{ label: 'キャンセル', value: null }, { label: 'この内容にする', kind: 'primary', value: () => ({
        name: cleanLine(name.value), company: cleanLine(company.value), nameKana: cleanLine(kana.value), department: cleanLine(dept.value), title: cleanLine(title.value),
        receiptName: autoCb.checked ? null : cleanLine(receipt.value), keywords: tidyKeywords(clean(kw.value)), memo: clean(memo.value), groupIds: gp.value(),
      }) }],
    });
    gp.cleanup?.();
    if (!v) return;
    if (v.company !== r.company) r.link = 'auto';
    r.name = v.name; r.company = v.company;
    Object.assign(ex, { nameKana: v.nameKana, department: v.department, title: v.title, receiptName: v.receiptName, keywords: v.keywords, memo: v.memo, groupIds: v.groupIds });
    if (r.uncertain && !hasUnknown(r.company) && !hasUnknown(r.name) && r.company && r.name) { r.uncertain = false; if (!r.note.includes('同じ企業に同じ名前')) r.note = ''; }
    onSaved();
  }
  /** 行の追加情報の要約（表と確認画面で使う） */
  function extraSummary(r, { full = false } = {}) {
    const ex = r.extra || {};
    const items = [];
    const gs = rowGroups(r);
    if (gs.length) items.push(groupChips(gs, { small: true }));
    if (ex.nameKana) items.push(h('span', { class: 'xtag' }, `読み: ${ex.nameKana}`));
    if (ex.department || ex.title) items.push(h('span', { class: 'xtag' }, [ex.department, ex.title].filter(Boolean).join(' ')));
    if (ex.receiptName) items.push(h('span', { class: 'xtag' }, '宛名: 手入力'));
    if (ex.keywords) items.push(h('span', { class: 'xtag' }, `キーワード: ${ex.keywords}`));
    if (ex.memo) items.push(h('span', { class: 'xtag', title: ex.memo }, full ? `メモ: ${ex.memo.length > 30 ? `${ex.memo.slice(0, 30)}…` : ex.memo}` : 'メモあり'));
    return items.length ? h('div', { class: 'xsummary' }, items) : null;
  }

  // ---------- ② 表で修正 ----------
  function renderTable() {
    stage = 'table';
    const tbody = h('tbody');
    const counter = h('span', { class: 'small muted' });
    const refresh = () => {
      fill(tbody, rows.map((r, i) => rowEl(r, i)));
      counter.textContent = `${rows.filter((r) => r.include).length} / ${rows.length}行を登録`;
    };
    function rowEl(r, i) {
      const a = analyze(r);
      const company = h('input', { class: 'input', type: 'text', value: r.company, 'aria-label': `${i + 1}行目の企業名`, maxlength: 100 });
      const name = h('input', { class: 'input', type: 'text', value: r.name, 'aria-label': `${i + 1}行目の名前`, maxlength: 100 });
      company.classList.toggle('has-unknown', hasUnknown(r.company));
      name.classList.toggle('has-unknown', hasUnknown(r.name));
      const edited = () => { if (r.uncertain && !hasUnknown(r.company) && !hasUnknown(r.name) && r.company && r.name) { r.uncertain = false; r.note = r.note.includes('同じ企業に同じ名前') ? r.note : ''; } };
      company.addEventListener('change', () => { r.company = cleanLine(company.value); r.link = 'auto'; edited(); refresh(); });
      name.addEventListener('change', () => { r.name = cleanLine(name.value); edited(); refresh(); });
      const inc = h('input', { type: 'checkbox', checked: r.include, 'aria-label': `${i + 1}行目を登録する` });
      inc.addEventListener('change', () => { r.include = inc.checked; refresh(); });
      // 企業の扱い
      let linkCtl = null;
      if (r.company && a.cands.length) {
        linkCtl = h('select', { class: 'input input-sm', 'aria-label': `${i + 1}行目の企業の扱い` }, [
          ...a.cands.map((c) => h('option', { value: c.id }, `登録済み「${c.name}」に紐付け（${c.id}・${c.reason}）`)),
          h('option', { value: 'new' }, '新しい企業として登録'),
        ]);
        linkCtl.value = a.linkId || 'new';
        linkCtl.addEventListener('change', () => { r.link = linkCtl.value; refresh(); });
      }
      const notes = [];
      const unk = hasUnknown(r.company) || hasUnknown(r.name);
      if (r.uncertain || r.note || unk) notes.push(h('span', { class: 'badge badge-warn' }, '要確認'));
      if (unk) notes.push(h('span', { class: 'small warn-text' }, ['読めなかった文字があります: ', markUnknown([r.company, r.name].filter(hasUnknown).join(' ／ ')), '。正しい文字に直してください']));
      if (r.note) notes.push(h('span', { class: 'small warn-text' }, r.note));
      if (!r.name) notes.push(h('span', { class: 'small warn-text' }, '名前が空です（企業のみとして登録します）'));
      if (!r.company) notes.push(h('span', { class: 'small muted' }, '企業名なし（個人のみとして登録します）'));
      if (a.dupPersons.length) notes.push(h('span', { class: 'small warn-text' }, `同じ名前の登録情報あり: ${a.dupPersons.map((p) => `${p.name}（${p.companyName || '企業なし'}）`).join('、')}`));
      return h('tr', { class: r.include ? '' : 'row-excluded' }, [
        h('td', { 'data-label': '登録' }, inc),
        h('td', { 'data-label': '企業名' }, [company, linkCtl]),
        h('td', { 'data-label': '名前' }, [name, extraSummary(r)]),
        h('td', { 'data-label': '状態' }, h('div', { class: 'bulk-notes' }, notes.length ? notes : h('span', { class: 'small muted' }, '—'))),
        h('td', { class: 'actions' }, [
          h('button', { type: 'button', class: 'btn btn-xs btn-edit', title: '読み・部署・役職・領収証宛名・グループ・キーワード・メモを入力します', onclick: () => editRow(r, refresh) }, '詳細を編集'),
          i > 0 ? h('button', { type: 'button', class: 'btn btn-xs', title: '上の行とつなげて1行にします', onclick: () => {
            const up = rows[i - 1];
            up.company = cleanLine(`${up.company} ${r.company}`); up.name = cleanLine(`${up.name} ${r.name}`); up.link = 'auto';
            if (up.company && up.name) { up.uncertain = false; up.note = ''; }
            rows.splice(i, 1); refresh();
          } }, '上と結合') : null,
          h('button', { type: 'button', class: 'btn btn-xs btn-danger-ghost', onclick: () => { rows.splice(i, 1); refresh(); } }, '削除'),
        ]),
      ]);
    }
    fill(root,
      h('section', { class: 'card' }, [
        h('div', { class: 'card-head' }, [h('h2', { class: 'card-title' }, '② 内容を修正する'), counter]),
        h('p', { class: 'small muted' }, '行ごとに企業名と名前を直せます。読み・部署・役職・領収証宛名・グループ・キーワード・メモは「詳細を編集」で入力できます（通常の登録画面と同じ項目）。2行に分かれてしまった項目は「上と結合」でつなげてください。登録しない行はチェックを外します。'),
        h('div', { class: 'table-wrap' }, h('table', { class: 'table bulk-table' }, [h('thead', {}, h('tr', {}, ['登録', '企業名', '名前', '状態', ''].map((x) => h('th', {}, x)))), tbody])),
        h('div', { class: 'row' }, h('button', { type: 'button', class: 'btn btn-ghost btn-sm', onclick: () => { rows.push({ key: ++seq, include: true, company: '', name: '', uncertain: false, note: '', link: 'auto' }); refresh(); } }, '＋ 行を追加')),
      ]),
      err,
      h('div', { class: 'form-actions' }, [
        h('button', { type: 'button', class: 'btn btn-ghost', onclick: renderInput }, '← 貼り付けに戻る'),
        h('button', { type: 'button', class: 'btn btn-primary btn-lg', onclick: () => {
          showErr('');
          const targets = rows.filter((r) => r.include);
          if (!targets.length) { showErr('登録する行がありません。登録する行にチェックを入れてください。'); return; }
          const bad = targets.find((r) => !r.company && !r.name);
          if (bad) { showErr('企業名も名前も空の行があります。削除するか入力してください。'); return; }
          renderConfirm();
        } }, '③ 確認へ進む'),
      ]),
    );
    refresh();
  }

  // ---------- ③ 確認 ----------
  function plan() {
    const targets = rows.filter((r) => r.include);
    const newCompanies = new Map(); // 正規化名 → 表示名（同じ一覧内の同名は1社にまとめる）
    const items = targets.map((r) => {
      const a = analyze(r);
      let companyAction = 'none'; let companyLabel = '';
      if (r.company) {
        if (a.linkId) { companyAction = 'existing'; companyLabel = `登録済み（${a.linkId}）に紐付け`; } else {
          companyAction = 'new'; companyLabel = '新しく作成';
          const k = normalize(r.company);
          if (!newCompanies.has(k)) newCompanies.set(k, r.company);
        }
      }
      return { r, a, companyAction, companyLabel, receipt: rowReceipt(r) };
    });
    // 同じ一覧の中で同じ新しい企業を使う行には、その旨を表示
    const countByKey = new Map();
    for (const x of items) if (x.companyAction === 'new') { const k = normalize(x.r.company); countByKey.set(k, (countByKey.get(k) || 0) + 1); }
    for (const x of items) if (x.companyAction === 'new') { const c = countByKey.get(normalize(x.r.company)); if (c > 1) x.companyLabel = `新しく作成（この一覧の${c}行で共通の1社）`; }
    return { items, newCompanies, excluded: rows.length - targets.length };
  }
  function renderConfirm() {
    stage = 'confirm';
    const p = plan();
    const persons = p.items.filter((x) => x.r.name).length;
    const companyOnly = p.items.filter((x) => !x.r.name).length;
    const linked = p.items.filter((x) => x.companyAction === 'existing').length;
    const isWarn = (x) => x.r.uncertain || x.a.dupPersons.length || hasUnknown(x.r.company) || hasUnknown(x.r.name);
    const warn = p.items.filter(isWarn);
    const unknownRows = p.items.filter((x) => hasUnknown(x.r.company) || hasUnknown(x.r.name));
    const check = h('input', { type: 'checkbox', id: 'bulk-confirm' });
    const unknownCount = p.items.filter((x) => hasUnknown(x.r.company) || hasUnknown(x.r.name)).length;
    const regBtn = h('button', { type: 'button', class: 'btn btn-primary btn-lg', disabled: true, onclick: () => run(p) }, `④ ${p.items.length}件を登録する`);
    check.addEventListener('change', () => { regBtn.disabled = !check.checked; });
    fill(root,
      h('section', { class: 'card confirm-card' }, [
        h('h2', { class: 'card-title' }, '③ 登録内容の確認'),
        h('p', {}, 'まだ登録されていません。以下の内容で問題ないか確認してください。'),
        h('div', { class: 'stats stats-4' }, [
          h('div', { class: 'stat' }, [h('div', { class: 'stat-num' }, String(persons)), h('div', { class: 'stat-label' }, '登録する人物')]),
          h('div', { class: 'stat' }, [h('div', { class: 'stat-num' }, String(p.newCompanies.size)), h('div', { class: 'stat-label' }, '新しく作る企業')]),
          h('div', { class: 'stat' }, [h('div', { class: 'stat-num' }, String(linked)), h('div', { class: 'stat-label' }, '登録済み企業に紐付け')]),
          h('div', { class: 'stat' }, [h('div', { class: 'stat-num' }, String(p.excluded)), h('div', { class: 'stat-label' }, '登録しない行')]),
        ]),
        companyOnly ? h('p', { class: 'small' }, `名前が空の${companyOnly}行は、企業のみとして登録します。`) : null,
        warn.length ? h('div', { class: 'notice notice-warn' }, [
          h('p', {}, `要確認の行が${warn.length}件あります（表の「要確認」）。このまま登録してよいか確認してください。`),
          unknownRows.length ? h('p', {}, h('strong', {}, `うち${unknownRows.length}件に、画像から読めなかった文字「?」が残っています。そのまま登録すると「?」のまま保存されます。`)) : null,
        ]) : null,
        h('p', { class: 'small muted' }, ['共通キーワード: ', tidyKeywords(keywords.value) || '（なし）', '　グループ: ', groupChips(groups.value(), { small: true, empty: '（なし）' })]),
        h('div', { class: 'table-wrap' }, h('table', { class: 'table' }, [
          h('thead', {}, h('tr', {}, ['', '企業名', '企業の扱い', '名前', '領収証宛名', 'グループ・メモなど'].map((x) => h('th', {}, x)))),
          h('tbody', {}, p.items.map((x, i) => h('tr', {}, [
            h('td', { 'data-label': 'No.' }, [String(i + 1), isWarn(x) ? h('span', { class: 'badge badge-warn' }, '要確認') : null]),
            h('td', { 'data-label': '企業名' }, x.r.company ? markUnknown(x.r.company) : h('span', { class: 'muted' }, '（なし）')),
            h('td', { 'data-label': '企業の扱い' }, x.companyLabel || '—'),
            h('td', { 'data-label': '名前' }, x.r.name ? markUnknown(x.r.name) : h('span', { class: 'muted' }, '（企業のみ）')),
            h('td', { 'data-label': '領収証宛名' }, markUnknown(x.receipt)),
            h('td', { 'data-label': 'グループ・メモなど' }, [extraSummary(x.r, { full: true }) || h('span', { class: 'muted' }, '—'), (!x.r.name && x.companyAction === 'existing' && (x.r.extra?.memo || x.r.extra?.keywords)) ? h('div', { class: 'small warn-text' }, '登録済みの企業には、グループだけを追加します（メモ・キーワードは企業の画面で編集してください）') : null]),
          ]))),
        ])),
        h('label', { class: 'check ocr-confirm' }, [check, unknownCount ? ` 上の内容を確認しました（「?」が残っている${unknownCount}件も、このまま登録します）` : ' 上の内容を確認しました（企業名・名前・企業の扱い・領収証宛名・グループ・メモなど）']),
      ]),
      err,
      h('div', { class: 'form-actions' }, [h('button', { type: 'button', class: 'btn btn-ghost', onclick: renderTable }, '← 戻って修正する'), regBtn]),
    );
    root.scrollIntoView({ block: 'start' });
  }

  // ---------- ④ 登録 ----------
  async function run(p) {
    stage = 'saving';
    const kw = tidyKeywords(keywords.value);
    const gids = groups.value();
    const progress = h('p', {}, '登録しています…');
    fill(root, h('section', { class: 'card' }, [h('h2', { class: 'card-title' }, '④ 登録中'), loading('登録しています。画面を閉じないでください。'), progress]));
    const createdCompany = new Map(); // 正規化名 → 新しい企業ID
    const done = []; const failed = [];
    let n = 0;
    for (const x of p.items) {
      n++;
      progress.textContent = `${n} / ${p.items.length}件目`;
      try {
        let companyId = null;
        if (x.companyAction === 'existing') companyId = x.a.linkId;
        else if (x.companyAction === 'new') {
          const k = normalize(x.r.company);
          companyId = createdCompany.get(k) || null;
          if (!companyId) {
            const onlyCompany = !x.r.name;
            const c = await createCompany({
              name: x.r.company, nameKana: onlyCompany ? (x.r.extra?.nameKana || '') : '',
              keywords: onlyCompany ? rowKeywords(x.r) : kw,
              receiptName: onlyCompany ? x.receipt : (receiptFmt.value === 'company-onchu' ? `${cleanLine(x.r.company)} 御中` : `${cleanLine(x.r.company)} 様`),
              memo: onlyCompany ? (x.r.extra?.memo || '') : '',
              confirmDuplicate: true, groupIds: onlyCompany ? rowGroups(x.r) : [],
            });
            companyId = c.id; createdCompany.set(k, companyId);
          }
        }
        if (x.r.name) {
          const ex = x.r.extra || {};
          const r = await createPerson({
            name: x.r.name, nameKana: ex.nameKana || '', department: ex.department || '', title: ex.title || '',
            keywords: rowKeywords(x.r), receiptName: x.receipt, memo: ex.memo || '',
            company: companyId ? { mode: 'existing', id: companyId } : { mode: 'none' }, groupIds: rowGroups(x.r), confirmDuplicate: true,
          });
          done.push({ type: 'person', id: r.id, label: `${x.r.name}（${x.r.company || '企業なし'}）` });
        } else {
          if (companyId && x.companyAction === 'existing') for (const g of rowGroups(x.r)) await setMembership('company', companyId, g, true);
          done.push({ type: 'company', id: companyId, label: x.r.company });
        }
        x.r.include = false; // 登録済みの行は、失敗時に戻ったとき二重登録しないよう外す
        x.r.note = '登録済み';
      } catch (e) {
        failed.push({ label: `${x.r.name || ''}（${x.r.company || '企業なし'}）`, message: dbErrorMessage(e) });
        break; // 以降は止めて状況を知らせる
      }
    }
    stage = 'done';
    rows = rows.filter((r) => r.note !== '登録済み');
    fill(root, h('section', { class: 'card' }, [
      h('h2', { class: 'card-title' }, failed.length ? '登録が途中で止まりました' : '登録しました'),
      h('p', {}, `${done.length}件を登録しました。`),
      failed.length ? h('div', { class: 'notice notice-error', role: 'alert' }, [
        h('p', {}, `「${failed[0].label}」で止まりました: ${failed[0].message}`),
        h('p', { class: 'small' }, `残りの${rows.filter((r) => r.include).length}件は登録されていません。「残りを確認する」から続きを登録できます（登録済みの行は表から外してあります）。`),
      ]) : null,
      done.length ? h('ul', { class: 'history' }, done.slice(0, 50).map((d) => h('li', {}, h('button', { type: 'button', class: 'linkish', onclick: () => go(d.type, { id: d.id }) }, d.label)))) : null,
      h('div', { class: 'form-actions' }, [
        failed.length ? h('button', { type: 'button', class: 'btn btn-secondary', onclick: renderTable }, '残りを確認する') : null,
        h('button', { type: 'button', class: 'btn btn-ghost', onclick: () => { rows = []; textarea.value = ''; renderInput(); } }, '別の一覧を登録する'),
        h('button', { type: 'button', class: 'btn btn-primary', onclick: () => onDone(kw) }, '検索画面で確認する'),
      ]),
    ]));
    if (done.length) toast(`${done.length}件を登録しました`, 'success');
  }

  renderInput();
  return {
    el: root,
    cleanup: groups.cleanup,
    isDirty: () => stage === 'saving' || ((stage === 'table' || stage === 'confirm') && rows.length > 0) || (stage === 'input' && !!textarea.value.trim()),
  };
}

let current = null;

async function go(view, params = {}, { push = true, replace = false } = {}) {
  if (current?.canLeave && !(await current.canLeave())) return;
  current?.cleanup?.();
  if (push && current && !replace) backStack.push(current.route);
  if (backStack.length > 30) backStack.shift();
  const outlet = document.getElementById('app');
  outlet.replaceChildren();
  window.scrollTo(0, 0);
  const v = VIEWS[view]({ outlet, params }) || {};
  current = { ...v, route: { view, params } };
  document.querySelectorAll('.nav button').forEach((b) => b.classList.toggle('active', b.dataset.view === (view === 'admin' ? 'admin' : view === 'register' ? 'register' : view === 'search' ? 'search' : '')));
  const off = v.onData ? onData(v.onData) : null;
  const cleanup = current.cleanup;
  current.cleanup = () => { off?.(); cleanup?.(); };
}

// ---------- 画像の選択・前処理 ----------
function pickImageFile(capture) {
  return new Promise((resolve) => {
    const input = h('input', { type: 'file', accept: 'image/jpeg,image/png,image/webp,image/*', class: 'sr-only' });
    if (capture) input.setAttribute('capture', 'environment');
    input.addEventListener('change', () => { resolve(input.files?.[0] || null); input.remove(); }, { once: true });
    input.addEventListener('cancel', () => { resolve(null); input.remove(); }, { once: true });
    document.body.append(input);
    input.click();
  });
}
const SUPPORTED_LABEL = 'JPG・JPEG・PNG・WebP';
async function loadImageFile(file) {
  const type = (file.type || '').toLowerCase();
  const ok = ['image/jpeg', 'image/jpg', 'image/png', 'image/webp', 'image/heic', 'image/heif', 'image/gif', 'image/bmp'].includes(type) || (!type && /\.(jpe?g|png|webp|heic|heif)$/i.test(file.name || ''));
  if (!ok) throw new AppError('UNSUPPORTED', `対応していないファイル形式です（${type || file.name || '不明'}）。${SUPPORTED_LABEL} の画像を選んでください。`);
  if (file.size === 0) throw new AppError('EMPTY', 'ファイルが空です。別の画像を選んでください。');
  if (file.size > 40 * 1024 * 1024) throw new AppError('TOO_LARGE', 'ファイルが大きすぎます（40MBまで）。');
  let source = null;
  try { source = await createImageBitmap(file, { imageOrientation: 'from-image' }); } catch { source = null; }
  if (!source?.width) throw new AppError('DECODE', `画像を読み込めませんでした。ファイルが壊れているか、このブラウザで表示できない形式です。${SUPPORTED_LABEL} の画像でお試しください。`);
  const originalHash = await sha256Hex(await file.arrayBuffer()).catch(() => '');
  return { source, originalHash, name: file.name || '' };
}
async function renderImage(source, rotation = 0) {
  const long = Math.max(source.width, source.height);
  // 長辺2000pxまで縮小。小さい画像は長辺1400px（最大1.8倍）まで拡大（PC版の実測で文字認識が最も安定した大きさ）
  const scale = long > 2000 ? 2000 / long : long < 1400 ? Math.min(1.8, 1400 / long) : 1;
  const w = Math.round(source.width * scale);
  const hh = Math.round(source.height * scale);
  const rot = ((rotation % 360) + 360) % 360;
  const c = document.createElement('canvas');
  c.width = rot % 180 === 0 ? w : hh;
  c.height = rot % 180 === 0 ? hh : w;
  const x = c.getContext('2d');
  x.fillStyle = '#fff';
  x.fillRect(0, 0, c.width, c.height);
  if (rot === 90) x.setTransform(0, 1, -1, 0, hh, 0);
  else if (rot === 180) x.setTransform(-1, 0, 0, -1, w, hh);
  else if (rot === 270) x.setTransform(0, -1, 1, 0, 0, w);
  x.imageSmoothingQuality = 'high';
  x.drawImage(source, 0, 0, w, hh);
  const blob = await new Promise((r) => c.toBlob(r, 'image/jpeg', 0.95));
  if (!blob) throw new AppError('CONVERT', '画像の変換に失敗しました。別の画像でお試しください。');
  return { blob, width: c.width, height: c.height, url: URL.createObjectURL(blob), sha256: await sha256Hex(await blob.arrayBuffer()) };
}
async function sha256Hex(buf) {
  const d = await crypto.subtle.digest('SHA-256', buf);
  return [...new Uint8Array(d)].map((b) => b.toString(16).padStart(2, '0')).join('');
}

// ---------- Claude による文字の読み取り ----------
const OCR_PROMPT = `あなたは名刺・書類の文字を読み取る係です。添付画像は日本の名刺、または企業名・個人名が書かれた書類です。
次の規則を必ず守り、JSONだけを返してください。
- 画像に実際に書かれている文字だけを、書かれている通りに書き写す。推測・補完・創作をしない。
- 読めない、または判別に迷う項目は value を "" にし、confidence を "low" か "none" にする。候補が複数あれば options に入れる。
- confidence: "high"=はっきり読めて項目の種類も明確 / "medium"=読めるが項目の判断に少し迷う / "low"=不確実（value は必ず "" ）/ "none"=見当たらない。
- nameKana は画像に読み仮名（カタカナ・ひらがな）が印刷されている場合だけ入れる。漢字から読みを推測しない。
- companyName は法人格（株式会社など）を含めて書かれている通り。部署名は含めない。
- name は個人の氏名のみ（役職・部署を含めない）。姓と名の間に空白があれば保つ。
- lines には画像の文字を上から順に1行ずつ書き写す（最大40行）。
- 文字がほとんど読めない画像なら readable を false にする。
形式:
{"readable":true,"lines":["…"],"fields":{"companyName":{"value":"","confidence":"none","options":[],"reason":""},"name":{…},"nameKana":{…},"department":{…},"title":{…},"email":{…},"phone":{…},"address":{…},"url":{…}}}`;

const FIELD_KEYS = ['companyName', 'name', 'nameKana', 'department', 'title', 'email', 'phone', 'address', 'url'];
function sanitizeOcr(raw) {
  const out = { readable: !!raw?.readable, lines: [], fields: {} };
  out.lines = (Array.isArray(raw?.lines) ? raw.lines : []).map((l) => cleanLine(typeof l === 'string' ? l : l?.text)).filter(Boolean).slice(0, 40);
  for (const k of FIELD_KEYS) {
    const f = raw?.fields?.[k] || {};
    let confidence = ['high', 'medium', 'low', 'none'].includes(f.confidence) ? f.confidence : 'none';
    let value = cleanLine(f.value);
    if (confidence === 'low' || confidence === 'none') value = ''; // 不確実な項目は入力しない
    if (!value && (confidence === 'high' || confidence === 'medium')) confidence = 'none';
    let options = (Array.isArray(f.options) ? f.options : []).map(cleanLine).filter(Boolean).slice(0, 6);
    let unknownNote = '';
    if (hasUnknown(value)) { // 読めない文字を含む値は確定させない（候補として示す）
      options = [value, ...options.filter((o) => o !== value)];
      value = ''; confidence = 'low';
      unknownNote = '読めない文字（?）を含むため入力していません。候補を選んで「?」を直すか、画像を見て入力してください。';
    }
    const reasons = { name: '名前を判別できませんでした。画像を見て入力してください。', companyName: '企業名を判別できませんでした。画像を見て入力してください。' };

// ---------- 端末内での文字認識（Claudeを使わない。画像は外部に送られない） ----------
const abs = (p) => new URL(p, location.href).href;

    tessWorkerPromise = (async () => {
      await loadScriptOnce(abs('vendor/tesseract.min.js'));

      onProgress?.({ status: 'loading language traineddata', progress: 0 });

        const res = await fetch(abs(`vendor/lang/${code}.traineddata.gz.b64.txt`));
        if (!res.ok) throw new Error(`言語データ（${code}）を読み込めません（${res.status}）`);
        const b64 = (await res.text()).trim();
        const bin = atob(b64);
        const data = new Uint8Array(bin.length);

      });

}

  }
  const ex = extractFields(lines); // PC版と同じ抽出規則（不確実な項目は入力しない）

}
function sampleUnavailableReason() {

  if (!RT.canImages) return 'この画面ではClaudeに画像を送れません（組織の設定や、ページを開いているアプリ・アカウントによって使えない場合があります）。';

}

function createOcrPanel({ onFields, onLine, targets }) {

  const tools = h('div', { class: 'row ocr-tools', hidden: true }, [
    h('button', { type: 'button', class: 'btn btn-ghost btn-sm', onclick: () => rotate(-90) }, '⟲ 左に回転'),

    preview.src = img.url; preview.hidden = false; tools.hidden = false;
    const dups = duplicateImageOwners(pending.sha256, pending.originalHash);

  }
  async function rotate(deg) { if (!loaded || busy) return; rotation = (rotation + deg + 360) % 360; await prepare(); await runOcr(); }

      h('ul', {}, pending.dups.map((d) => h('li', {}, d.type === 'person' ? `人物: ${d.name}${d.companyName ? `（${d.companyName}）` : ''}  ${d.id}` : `企業: ${d.name}  ${d.id}`))),
    ]);
  }

    let failed = null;
    try {
      const raw = await RT.sample.json(OCR_PROMPT, { images: [pending.blob], signal: ctl.signal });
      const r = sanitizeOcr(raw);
      pending.ocrText = r.lines.join('\n');
      used = true;
      renderResult(r, 'Claude');

      ])

    if (!r.lines.length) return;

        h('span', { class: 'ocr-line-text' }, [hasUnknown(text) ? h('span', { class: 'badge badge-warn' }, '要確認') : null, ' ', markUnknown(text)]),
        h('span', { class: 'ocr-line-actions' }, targets().map((t) => h('button', { type: 'button', class: 'btn btn-xs', onclick: () => onLine(t.key, text) }, `${t.label}へ`))),

    h('p', { class: 'small muted' }, IS_LOCAL ? `名刺や資料を撮影するか、保存済みの画像（${SUPPORTED_LABEL}）を選ぶと、この端末内で文字を読み取って入力欄に反映します。画像は外部に送られず、この端末の中だけに保存されます。` : `名刺や資料を撮影するか、保存済みの画像（${SUPPORTED_LABEL}）を選ぶと、Claudeが文字を読み取って入力欄に反映します（Claudeを使えない環境では、この端末内で読み取ります）。Claudeで読み取る場合は画像がClaudeに送られます。画像は登録時にこのページの保存領域に保存されます。`),

async function suggestReading(text) {
  if (!RT.sample) throw new AppError('NO_SAMPLE', 'この環境では読みの推定を使えません。手動で入力してください。');
  const r = await RT.sample.json(`次の日本語の人名または企業名の、一般的な読みをカタカナで答えてください。法人格（株式会社など）も読みに含めます。読みが分からない・複数考えられる場合は "" にしてください。JSONのみ: {"reading":"…"}\n\n${text}`, { modelTier: 'quick' });

// ---------- 入力欄 ----------
let fieldSeq = 0;
function textField(key, label, { required = false, hint = '', placeholder = '', value = '', multiline = false, maxlength = 200 } = {}) {
  const id = `f-${key}-${++fieldSeq}`;
  const input = multiline ? h('textarea', { id, name: key, rows: 4, maxlength, placeholder }) : h('input', { id, name: key, type: 'text', maxlength, placeholder, autocomplete: 'off', required: required || undefined });

  const candBox = h('div', { class: 'cand-box', hidden: true });
  const errBox = h('div', { class: 'field-error', role: 'alert', hidden: true });
  const wrap = h('div', { class: 'field' }, [
    h('label', { class: 'field-label', for: id }, [label, required ? h('span', { class: 'req' }, '必須') : null, ocrTag]),
    h('div', { class: 'field-control' }, [input, candBox, errBox]),
    hint ? h('div', { class: 'field-hint' }, hint) : null,
  ]);
  const unkBox = h('div', { class: 'field-unknown', role: 'status', hidden: true }, [h('span', { class: 'badge badge-warn' }, '要確認'), ' ', UNKNOWN_MSG]);
  wrap.querySelector('.field-control').append(unkBox);
  const checkUnknown = () => { const u = hasUnknown(input.value); unkBox.hidden = !u; input.classList.toggle('has-unknown', u); };
  input.addEventListener('input', () => { input.classList.remove('ocr-filled'); ocrTag.hidden = true; setError(''); checkUnknown(); });
  input.addEventListener('ocr-set', checkUnknown);
  input.addEventListener('change', checkUnknown);
  queueMicrotask(checkUnknown);
  function setError(msg) { errBox.textContent = msg; errBox.hidden = !msg; input.classList.toggle('invalid', !!msg); }

    key, wrap, input, setError,
    get value() { return input.value; },
    set value(v) { input.value = v ?? ''; checkUnknown(); },
    markOcr() { input.classList.add('ocr-filled'); ocrTag.hidden = false; checkUnknown(); },
    hasUnknown: () => hasUnknown(input.value),

      candBox.replaceChildren(); candBox.hidden = true;

      checkUnknown();
      const others = (fr.options || []).filter((o) => o !== input.value);

        candBox.hidden = false;
        if (fr.reason && !filled) candBox.append(h('div', { class: 'small warn-text' }, fr.reason));
        if (others.length) {
          candBox.append(h('div', { class: 'chips' }, [h('span', { class: 'small muted' }, filled ? '他の候補:' : '候補（タップで入力）:'),
            ...others.map((o) => h('button', { type: 'button', class: 'chip chip-btn', onclick: () => { input.value = o; f.markOcr(); input.dispatchEvent(new CustomEvent('ocr-set')); } }, markUnknown(o)))]));
        }

    },

}

function receiptField(getParts, initial = '', { auto = true } = {}) {
  const f = textField('receiptName', '領収証宛名', { hint: '領収証に記載する宛名です。名前・企業名から自動で作成します（直接書き換えることもできます）。', value: initial });

    const { person, company } = getParts();
    const alts = [...new Set([defaultReceiptName(person, company), company ? defaultReceiptName('', company) : '', person ? defaultReceiptName(person, '') : ''])].filter((a) => a && a !== f.input.value);

function kanaField(key, label, getSource, value = '') {
  const f = textField(key, label, { placeholder: '例: ヤマダ タロウ', value, hint: '読みを登録すると、ひらがな・カタカナでも検索できます。' });

      } catch (e) { toast(e instanceof AppError ? e.message : sampleErrorMessage(e), 'error', 5000); } finally { btn.disabled = false; btn.textContent = '読みの候補を入力'; }

function companyPicker(initialCompany, { onChange }) {
  const f = textField('companyName', '企業名', { placeholder: '例: 株式会社サンプル', maxlength: 100, hint: '入力すると登録済みの企業が候補に表示されます。既存の企業に紐付ける場合は候補から選んでください。', value: initialCompany?.name || '' });
  let selected = initialCompany ? { id: initialCompany.id, name: initialCompany.name } : null;
  let suggestions = []; let active = -1;
  const list = h('ul', { class: 'suggest-list', role: 'listbox', hidden: true });
  const status = h('div', { class: 'company-status', 'aria-live': 'polite' });
  const kana = textField('companyKana', '企業名の読み（新しい企業として登録する場合・任意）', { placeholder: '例: サンプル' });
  f.input.setAttribute('role', 'combobox');

    if (selected) {
      status.className = 'company-status ok';
      fill(status, `✓ 登録済みの企業「${selected.name}」（${selected.id}・人物${personCount(selected.id)}名）に紐付けます。`, h('button', { type: 'button', class: 'btn btn-xs', onclick: () => { selected = null; renderStatus(); onChange(); f.input.focus(); } }, '選択を解除'));
